name: ci

# devex 改造（build(devex) PR）：
#   - 三段 job：lint（clang-tidy 增量门禁 + deb 闭包冒烟）→ linux（编译+测试）
#     → windows（原样）。lint 与编译并行，不串行排队。
#   - 不拆 per-module 测试 job：GB 级 QGIS 依赖在 runner 间流转不划算
#     （apt 装一轮 6min+），用 ctest LABELS -L/-LE 在同机分步替代。
#   - ccache：launcher 由 CMakeLists 检测，CI 只管缓存与安装。
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_tidy 需要 merge-base(origin/master)
      # clang-tidy 版本钉死：告警面随 LLVM 版本漂移，门禁必须可复现。
      # 升级 = 有意变更：改此包名 + 本地同步跑一轮收录新告警。
      - name: Pin clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-20 python3
      - name: Install QGIS/Qt headers (configure 需要 find_package 全绿才有 compile_commands)
        run: |
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 755 /etc/apt/keyrings
          sudo curl -fsSL https://download.qgis.org/downloads/qgis-archive-keyring.gpg -o /etc/apt/keyrings/qgis-archive-keyring.gpg
          printf 'Types: deb\nURIs: https://qgis.org/debian\nSuites: resolute\nArchitectures: amd64\nComponents: main\nSigned-By: /etc/apt/keyrings/qgis-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/qgis.sources
          sudo apt-get update
          sudo apt-get install -y qgis qgis-providers libqgis-dev qt6-base-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev qt6-webengine-dev qt6-pdf-dev libgdal-dev
      - name: Configure (compile_commands.json only)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # .cpp 内 Q_OBJECT 类靠 `#include "*.moc"`（AUTOMOC 产物）；只 configure
      # 不 build 时该文件不存在，clang-tidy 报 clang-diagnostic-error。
      # 先生成全部 *_autogen 目标（只跑 moc/uic，不编译，秒级）。
      - name: Generate AUTOMOC stubs (.cpp 内 Q_OBJECT 的 .moc 包含)
        run: |
          targets=$(cmake --build build --target help | grep -oE '[A-Za-z0-9_-]+_autogen' | sort -u)
          echo "autogen targets: $targets"
          cmake --build build --target $targets
      - name: clang-tidy gate (changed src/ TUs vs merge-base)
        env:
          PALEO_CLANG_TIDY: clang-tidy-20
        run: python3 tools/check_tidy.py --base origin/master
      - name: deb-closure smoke (ET1：锁文件可解析、条目格式合法，零下载)
        run: ./vendor/fetch-deps.sh --print-only

  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QGIS 4.2 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 755 /etc/apt/keyrings
          sudo curl -fsSL https://download.qgis.org/downloads/qgis-archive-keyring.gpg -o /etc/apt/keyrings/qgis-archive-keyring.gpg
          printf 'Types: deb\nURIs: https://qgis.org/debian\nSuites: resolute\nArchitectures: amd64\nComponents: main\nSigned-By: /etc/apt/keyrings/qgis-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/qgis.sources
          sudo apt-get update
          sudo apt-get install -y qgis qgis-providers libqgis-dev qt6-base-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev qt6-webengine-dev qt6-pdf-dev libgdal-dev libproj-dev libgeos-dev ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Cache vendor artifacts
        uses: actions/cache@v4
        with:
          path: |
            vendor/onnxruntime
          key: ${{ runner.os }}-ort-${{ hashFiles('vendor/manifest.json') }}
      - name: Vendor dependencies
        run: ./paleo-dev bootstrap
      - name: Build
        run: ./paleo-dev build
      - name: Test (headless, isolated-module labels first)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
        # 并行轮失败时串行重跑失败项一次：QGIS 栈建/计时类在 -j 负载下
        # 有环境性抖动（本地串行全绿）；重跑仍挂才算真失败。::warning 留痕。
        run: |
          ./paleo-dev test -LE core -j "$(nproc)" || {
            echo "::warning::并行轮有失败，串行重跑失败项排除负载抖动"
            QT_QPA_PLATFORM=offscreen ctest --test-dir build -j1 --rerun-failed --output-on-failure
          }
      - name: Test (full-stack umbrella tests)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
        run: |
          ./paleo-dev test -L core -j "$(nproc)" || {
            echo "::warning::并行轮有失败，串行重跑失败项排除负载抖动"
            QT_QPA_PLATFORM=offscreen ctest --test-dir build -j1 --rerun-failed --output-on-failure
          }
      - name: Selfcheck
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./paleo-dev selfcheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-linux
          path: vendor/logs/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache vendor artifacts
        uses: actions/cache@v4
        with:
          path: |
            vendor/onnxruntime
            vendor/cache
          key: ${{ runner.os }}-vendor-${{ hashFiles('vendor/manifest.json') }}
      - name: Vendor dependencies (OSGeo4W route per docs/phase0/et0-vendor-comparison.md)
        shell: pwsh
        run: ./paleo-dev.ps1 bootstrap
      - name: Build (MSVC + vendored QGIS)
        shell: pwsh
        run: ./paleo-dev.ps1 build
      - name: Test (headless；Windows NativeFormat 走注册表，QSettings 沙箱不适用，保持串行)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./paleo-dev.ps1 test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-windows
          path: vendor/logs/
