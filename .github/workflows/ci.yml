name: ci

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QGIS 4.2 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 755 /etc/apt/keyrings
          sudo curl -fsSL https://download.qgis.org/downloads/qgis-archive-keyring.gpg -o /etc/apt/keyrings/qgis-archive-keyring.gpg
          printf 'Types: deb\nURIs: https://qgis.org/debian\nSuites: resolute\nArchitectures: amd64\nComponents: main\nSigned-By: /etc/apt/keyrings/qgis-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/qgis.sources
          sudo apt-get update
          sudo apt-get install -y qgis qgis-providers libqgis-dev qt6-base-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev qt6-webengine-dev qt6-pdf-dev libgdal-dev libproj-dev libgeos-dev
      - name: Vendor dependencies
        run: ./paleo-dev bootstrap
      - name: Build
        run: ./paleo-dev build
      - name: Test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
        run: ./paleo-dev test
      - name: Selfcheck
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./paleo-dev selfcheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-linux
          path: vendor/logs/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor dependencies (OSGeo4W route per docs/phase0/et0-vendor-comparison.md)
        shell: pwsh
        run: ./paleo-dev.ps1 bootstrap
      - name: Build (MSVC + vendored QGIS)
        shell: pwsh
        run: ./paleo-dev.ps1 build
      - name: Test (headless)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./paleo-dev.ps1 test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-windows
          path: vendor/logs/
