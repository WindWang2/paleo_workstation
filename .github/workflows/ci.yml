name: ci

# devex 改造（build(devex) PR）：
#   - 三段 job：lint（clang-tidy 增量门禁 + deb 闭包冒烟）→ linux（编译+测试）
#     → windows（原样）。lint 与编译并行，不串行排队。
#   - 不拆 per-module 测试 job：GB 级 QGIS 依赖在 runner 间流转不划算，
#     用 ctest LABELS -L/-LE 在同机分步替代。
#   - ccache：launcher 由 CMakeLists 检测，CI 只管缓存与安装。
#   - #136/#81：perf 标签（墙钟预算）不进必过门禁（-LE perf），单独跑在
#     非阻断的 linux-perf job，JUnit/日志作 artifact 做趋势。
#   - #138→#76（方向 71）：QGIS 版本钉死单一来源 vendor/deb-closure.lock，
#     三路（superbuild/deb 闭包/manifest 家族）一致性由
#     tools/check_qgis_versions.py 门禁看守；Linux 侧不再 apt 系统 QGIS，
#     统一走 deb 闭包 vendored 路（BUILDING.md「依赖来源策略」第 2 档）。
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# #75：只有 PR 分支「新 push 取消旧运行」；master/main 的每个 push 都必须
# 跑完（连续合并时旧逻辑会互相取消，master 拿不到任何完整结果）。
# master 的 group 带上 sha，避免同 ref 的运行彼此排队等待。
# #237：job 超时上限按实测时长（lint≈30m / linux≈35m / perf≈31m / windows≈84m）
# 留 2-3 倍余量，挂起不再吃默认 360 分钟。
# #237：GITHUB_TOKEN 最小权限——各 job 只需读源码（artifact/cache 走独立 runtime token）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# #76（方向 71）：Linux 侧 QGIS/GDAL/PROJ/GEOS 一律 vendored（deb 闭包），
# apt 只装政策例外面（Qt6 发行版包、qtkeychain、工具链）；QGIS 头经
# QGIS_PREFIX_PATH 指向 vendor/prefix/usr。
# deb 闭包缓存：缓存下载归档 vendor/cache/debs（键 = 锁+种子哈希，锁变即
# 重下）；解包产物 vendor/prefix 不缓存（bootstrap 检测到归档在缓存后本地
# 解包，dpkg-deb -x 是本地 CPU 面，不占 runner 网络与缓存配额）。

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_tidy 需要 merge-base(origin/master)
      # clang-tidy 版本钉死：告警面随 LLVM 版本漂移，门禁必须可复现。
      # 升级 = 有意变更：改此包名 + 本地同步跑一轮收录新告警。
      - name: Pin clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-20 python3
      # #76：Qt6 走发行版包（政策例外，superbuild D-QT）；QGIS/GDAL/PROJ/GEOS
      # 由 deb 闭包 vendored 提供，不 apt 系统 QGIS。
      - name: Install Qt6 dev packages (vendored 路只缺 Qt/工具面)
        run: sudo apt-get install -y
          qt6-base-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev
          qt6-webengine-dev qt6-pdf-dev qtkeychain-qt6-dev ninja-build pkg-config g++
      - name: Cache vendored deb closure
        uses: actions/cache@v4
        with:
          path: vendor/cache/debs
          key: ${{ runner.os }}-debclosure-${{ hashFiles('vendor/deb-closure.lock', 'vendor/deb-packages.txt') }}
      # compile_commands 需要 QGIS 头——bootstrap 拉 deb 闭包到 vendor/prefix。
      # fetch-only：只取依赖不编译（bootstrap 尾部的 build/selfcheck 属
      # linux job，lint 只要 compile_commands）。
      - name: Vendor dependencies (deb 闭包，QGIS 头来源 #76)
        run: ./paleo-dev bootstrap fetch-only
      - name: Configure (compile_commands.json only)
        env:
          QGIS_PREFIX_PATH: ${{ github.workspace }}/vendor/prefix/usr
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # .cpp 内 Q_OBJECT 类靠 `#include "*.moc"`（AUTOMOC 产物）；只 configure
      # 不 build 时该文件不存在，clang-tidy 报 clang-diagnostic-error。
      # 先生成全部 *_autogen 目标（只跑 moc/uic，不编译，秒级）。
      - name: Generate AUTOMOC stubs (.cpp 内 Q_OBJECT 的 .moc 包含)
        run: |
          targets=$(cmake --build build --target help | grep -oE '[A-Za-z0-9_-]+_autogen' | sort -u)
          echo "autogen targets: $targets"
          cmake --build build --target $targets
      # #137：直推 master 时 origin/master == HEAD，旧的 --base origin/master
      # 永远「无改动」。push 用 event.before（新分支首推的全零 SHA / 不可达时
      # 回退 HEAD~1），PR 用目标分支；check_tidy.py 自身也在 merge-base==HEAD
      # 时回退 HEAD~1，并打印实际 base。
      - name: clang-tidy gate (changed src/ TUs vs push-before / PR base)
        env:
          PALEO_CLANG_TIDY: clang-tidy-20
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_REF" ]; then
            base="origin/$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="HEAD~1"
          fi
          echo "tidy base: $base ($(git rev-parse --short "$base" 2>/dev/null || echo '?'))"
          python3 tools/check_tidy.py --base "$base"
      - name: Source gates (layering / ui invariants / i18n / QGIS 版本口径，按脚本位置定位源码根)
        run: |
          python3 tools/check_layering.py --strict
          python3 tools/check_ui_invariants.py --strict
          python3 tools/check_ui_invariants.py --selftest
          python3 tools/check_i18n.py
          python3 tools/check_i18n.py --selftest
          python3 tools/check_qgis_versions.py
          python3 tools/check_qgis_versions.py --selftest
      - name: deb-closure smoke (ET1：锁文件可解析、条目格式合法，零下载)
        run: ./vendor/fetch-deps.sh --print-only

  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # #76（方向 71）：QGIS/GDAL/PROJ/GEOS 不再走 apt 系统 QGIS（原
      # tools/ci_apt_qgis.sh 已删）——bootstrap 统一拉 deb 闭包；apt 只装
      # 政策例外面（Qt6 发行版包/qtkeychain/ccache/工具链）。
      - name: Install Qt6 dev packages (vendored 路只缺 Qt/工具面)
        run: sudo apt-get update && sudo apt-get install -y
          qt6-base-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev
          qt6-webengine-dev qt6-pdf-dev qtkeychain-qt6-dev ccache ninja-build pkg-config
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Cache vendor artifacts
        uses: actions/cache@v4
        with:
          path: |
            vendor/onnxruntime
            vendor/cache/debs
          key: ${{ runner.os }}-ort-${{ hashFiles('vendor/manifest.json') }}-debclosure-${{ hashFiles('vendor/deb-closure.lock', 'vendor/deb-packages.txt') }}
      - name: Vendor dependencies
        run: ./paleo-dev bootstrap
      - name: Build
        id: build
        run: ./paleo-dev build
      - name: Test (headless, isolated-module labels first)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
        # 并行轮失败时串行重跑失败项一次：QGIS 栈建/计时类在 -j 负载下
        # 有环境性抖动（本地串行全绿）；重跑仍挂才算真失败。::warning 留痕。
        # #81：崩溃（SegFault/abort）不重跑，直接判红——见 tools/ci_ctest_gate.sh。
        # #136：perf 标签不进必过门禁，见 linux-perf job。
        run: tools/ci_ctest_gate.sh -LE 'core|perf'
      # #81：上一步红时这一步也要跑（旧行为：core 段在 master 上从未执行过）。
      - name: Test (full-stack umbrella tests)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
        run: tools/ci_ctest_gate.sh -L core -LE perf
      - name: Selfcheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./paleo-dev selfcheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-linux
          path: vendor/logs/
      # #150/#151：失败现场——ctest 完整日志、QtTest 落盘结果、黄金图当前渲染/差分。
      - name: Stage test diagnostics
        if: always()
        shell: bash
        run: |
          if [ -d build ]; then
            mkdir -p build/Testing/result-files
            find build -type f -name '*-result.txt' ! -path 'build/Testing/*' \
              -exec cp -f {} build/Testing/result-files/ \;
            if [ -d build/golden-out ]; then
              cp -a build/golden-out build/Testing/
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-linux
          retention-days: 14
          if-no-files-found: ignore
          path: build/Testing/

  # #136 / #81 余项：墙钟预算类（ctest -L perf）单独、串行、非阻断；阈值不动，
  # 结果作 artifact 做趋势跟踪。红了不拖累合并门禁，但在 run 页面可见。
  linux-perf:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # #76（方向 71）：同 linux job——QGIS 栈 vendored（deb 闭包），apt 只装
      # 政策例外面（Qt6 发行版包/qtkeychain/ccache/工具链）。
      - name: Install Qt6 dev packages (vendored 路只缺 Qt/工具面)
        run: sudo apt-get update && sudo apt-get install -y
          qt6-base-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev
          qt6-webengine-dev qt6-pdf-dev qtkeychain-qt6-dev ccache ninja-build pkg-config
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-perf-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-perf-
            ${{ runner.os }}-ccache-
      - name: Cache vendor artifacts
        uses: actions/cache@v4
        with:
          path: |
            vendor/onnxruntime
            vendor/cache/debs
          key: ${{ runner.os }}-ort-${{ hashFiles('vendor/manifest.json') }}-debclosure-${{ hashFiles('vendor/deb-closure.lock', 'vendor/deb-packages.txt') }}
      - name: Vendor dependencies
        run: ./paleo-dev bootstrap
      - name: Configure
        env:
          QGIS_PREFIX_PATH: ${{ github.workspace }}/vendor/prefix/usr
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build + run perf tests (serial)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
        run: tools/ci_perf.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results-linux
          if-no-files-found: ignore
          path: |
            build/perf-results/
            build/Testing/Temporary/LastTest*.log

  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Cache vendor artifacts
        uses: actions/cache@v4
        with:
          path: |
            vendor/onnxruntime
            vendor/cache
          key: ${{ runner.os }}-vendor-${{ hashFiles('vendor/manifest.json') }}
      # #134：Vendor 只取依赖；编译错误落在 Build 步骤（CI 下 ninja -k 0 一次暴露全部错误）。
      - name: Vendor dependencies (OSGeo4W route per docs/phase0/et0-vendor-comparison.md)
        shell: pwsh
        run: ./paleo-dev.ps1 bootstrap fetch-only
      - name: Build (MSVC + vendored QGIS)
        id: build
        shell: pwsh
        run: ./paleo-dev.ps1 build
      - name: Selfcheck
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./paleo-dev.ps1 selfcheck
      - name: Test (headless；Windows NativeFormat 走注册表，QSettings 沙箱不适用，保持串行)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PALEO_CTEST_ARGS: -LE perf # #136：墙钟预算类不进必过门禁
        run: ./paleo-dev.ps1 test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-windows
          path: vendor/logs/
      - name: Stage test diagnostics
        if: always()
        shell: pwsh
        run: |
          $build = Join-Path $PWD 'build'
          if (Test-Path $build) {
            $testing = Join-Path $build 'Testing'
            $resultDir = Join-Path $testing 'result-files'
            New-Item -ItemType Directory -Force $resultDir | Out-Null
            Get-ChildItem -Path $build -Recurse -File -Filter '*-result.txt' |
              Where-Object { $_.FullName -notlike "$testing*" } |
              Copy-Item -Destination $resultDir -Force
            $golden = Join-Path $build 'golden-out'
            if (Test-Path $golden) {
              Copy-Item -Path $golden -Destination $testing -Recurse -Force
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-windows
          retention-days: 14
          if-no-files-found: ignore
          path: build/Testing/
