name: ci

# devex 改造（build(devex) PR）：
#   - 三段 job：lint（clang-tidy 增量门禁 + deb 闭包冒烟）→ linux（编译+测试）
#     → windows（原样）。lint 与编译并行，不串行排队。
#   - 不拆 per-module 测试 job：GB 级 QGIS 依赖在 runner 间流转不划算，
#     用 ctest LABELS -L/-LE 在同机分步替代。
#   - ccache：launcher 由 CMakeLists 检测，CI 只管缓存与安装。
#   - #136/#81：perf 标签（墙钟预算）不进必过门禁（-LE perf），单独跑在
#     非阻断的 linux-perf job，JUnit/日志作 artifact 做趋势。
#   - 方向70：linux-asan 非阻断观察档（ASAN+UBSAN 全量 + 串行 ctest；
#     budget 断言经 PALEO_SANITIZER_BUILD 自动降档），稳定后转阻断。
#   - #138→#76（方向 71）：QGIS 版本钉死单一来源 vendor/deb-closure.lock，
#     三路（superbuild/deb 闭包/manifest 家族）一致性由
#     tools/check_qgis_versions.py 门禁看守；Linux 侧不再 apt 系统 QGIS，
#     统一走 deb 闭包 vendored 路（BUILDING.md「依赖来源策略」第 2 档）。
env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  # #764：flaky 台账 strict 档默认关闭 ⇒ 串行/直跑重跑放行「同一测试累计 ≥3 次」
  # 永远只 ::warning::、门禁永远不红（绿灯通胀）。台账经 actions/cache 跨 run 持久
  # 累计后开启 strict：同一测试被重跑洗白满阈值即硬红（check_flaky_ledger.py
  # --strict，见 tools/ci_ctest_gate.sh / paleo-dev.ps1 的 #501 接线）。
  # env_redset STALE 的 strict 档（PALEO_REDSET_STALE=strict）暂不默认开启：
  # 它依赖 tools/env_redset.json 现有 exempt/fixed 条目在 vendored 车道的实际
  # 通过面，翻转即可能在必过 linux 车道引入无法本地复现的新红——到期开启计划见
  # TODOS.md（#764）。
  PALEO_FLAKY_STRICT: "1"

on:
  push:
    branches: [main, master]
  pull_request:
  # PW-001/PW-054：merge queue 需要 merge_group 事件才能在队列里跑 required 检查。
  merge_group:
  workflow_dispatch:

# #75：只有 PR 分支「新 push 取消旧运行」；master/main 的每个 push 都必须
# 跑完（连续合并时旧逻辑会互相取消，master 拿不到任何完整结果）。
# master 的 group 带上 sha，避免同 ref 的运行彼此排队等待。
# #237：job 超时上限按实测时长（lint≈30m / linux≈35m / perf≈31m / windows≈84m）
# 留 2-3 倍余量，挂起不再吃默认 360 分钟。
# #237：GITHUB_TOKEN 最小权限——各 job 只需读源码（artifact/cache 走独立 runtime token）。
# #237：actions/* 一律 @<commit-sha> 钉死（旁注 # v4 便于识别），可变 tag 被
# 投毒时拿不到带 full token 的 checkout；升级 = 有意改 SHA。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  # merge_group 的 ref 每批唯一（gh-readonly-queue/...），按 sha 分组、不取消。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# #76（方向 71）：Linux 侧 QGIS/GDAL/PROJ/GEOS 一律 vendored（deb 闭包），
# apt 只装政策例外面（Qt6 发行版包、qtkeychain、工具链）；QGIS 头经
# QGIS_PREFIX_PATH 指向 vendor/prefix/usr。
# deb 闭包缓存：缓存下载归档 vendor/cache/debs（键 = 锁+种子哈希，锁变即
# 重下）；解包产物 vendor/prefix 不缓存（bootstrap 检测到归档在缓存后本地
# 解包，dpkg-deb -x 是本地 CPU 面，不占 runner 网络与缓存配额）。

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          submodules: recursive
          fetch-depth: 0 # check_tidy 需要 merge-base(origin/master)
      # clang-tidy 版本钉死：告警面随 LLVM 版本漂移，门禁必须可复现。
      # 升级 = 有意变更：改此包名 + 本地同步跑一轮收录新告警。
      - name: Pin clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-20 python3
      # #76：Qt6 走发行版包（政策例外，superbuild D-QT）；QGIS/GDAL/PROJ/GEOS
      # 由 deb 闭包 vendored 提供，不 apt 系统 QGIS。
      - name: Install Qt6 dev packages (vendored 路只缺 Qt/工具面)
        run: sudo apt-get install -y
          qt6-base-dev qt6-5compat-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev
          qt6-webengine-dev qt6-pdf-dev qtkeychain-qt6-dev ninja-build pkg-config g++ patchelf
      - name: Cache vendored deb closure
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: |
            vendor/cache/debs
            vendor/cache/lo
          key: ${{ runner.os }}-debclosure-${{ hashFiles('vendor/deb-closure.lock', 'vendor/deb-packages.txt') }}-lo-${{ hashFiles('vendor/manifest.json') }}
      # compile_commands 需要 QGIS 头——bootstrap 拉 deb 闭包到 vendor/prefix。
      # fetch-only：只取依赖不编译（bootstrap 尾部的 build/selfcheck 属
      # linux job，lint 只要 compile_commands）。
      - name: Vendor dependencies (deb 闭包，QGIS 头来源 #76)
        run: ./paleo-dev bootstrap fetch-only
      - name: Configure (compile_commands.json only)
        env:
          QGIS_PREFIX_PATH: ${{ github.workspace }}/vendor/prefix/usr
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # .cpp 内 Q_OBJECT 类靠 `#include "*.moc"`（AUTOMOC 产物）；只 configure
      # 不 build 时该文件不存在，clang-tidy 报 clang-diagnostic-error。
      # 先生成全部 *_autogen 目标（只跑 moc/uic，不编译，秒级）。
      - name: Generate AUTOMOC stubs (.cpp 内 Q_OBJECT 的 .moc 包含)
        run: |
          targets=$(cmake --build build --target help | grep -oE '[A-Za-z0-9_-]+_autogen' | sort -u)
          echo "autogen targets: $targets"
          cmake --build build --target $targets --parallel 8
      # #137：直推 master 时 origin/master == HEAD，旧的 --base origin/master
      # 永远「无改动」。push 用 event.before（新分支首推的全零 SHA / 不可达时
      # 回退 HEAD~1），PR 用目标分支；check_tidy.py 自身也在 merge-base==HEAD
      # 时回退 HEAD~1，并打印实际 base。
      - name: clang-tidy gate (changed src/ TUs vs push-before / PR base)
        env:
          PALEO_CLANG_TIDY: clang-tidy-20
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_REF" ]; then
            base="origin/$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="HEAD~1"
          fi
          echo "tidy base: $base ($(git rev-parse --short "$base" 2>/dev/null || echo '?'))"
          python3 tools/check_tidy.py --base "$base"
      - name: Source gates (layering / qgs-audit / ui invariants / ui size / file budget / i18n / QGIS 版本口径 / docs drift / cpp mainline，按脚本位置定位源码根)
        env:
          # #474：--transitive 的 QGIS 头目录探测约定名（vendor deb 闭包前缀，
          # 与上面 compile_commands 的 QGIS_PREFIX_PATH 同源）——func/ui 两指标
          # 的外部 qgs 边可解析才参与闸门；缺位时工具自动只闸 heavy_*。
          # #533 口径：本车道是 func/ui 两指标与 --qgs-audit 的权威闸口；
          # ctest 侧 layering_transitive 不注入 QGIS_PREFIX（同一信号不复制进
          # linux/windows 必过车道，裁决见 CMakeLists.txt 与 AGENTS.md）。
          QGIS_PREFIX: ${{ github.workspace }}/vendor/prefix/usr
          # #767：本步裸跑 python3 tools/check_*.py（不经 ctest），同样不要在
          # 源码树留 __pycache__ 字节码——与 ctest 侧 paleo-test-infra.cmake 的
          # PYTHONDONTWRITEBYTECODE=1 同口径。
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tools/check_layering.py --strict
          python3 tools/check_layering.py --selftest
          python3 tools/check_layering.py --symbol-audit
          python3 tools/check_layering.py --transitive
          python3 tools/check_layering.py --qgs-audit --strict
          python3 tools/check_qgis_spread.py --strict
          python3 tools/check_ui_invariants.py --strict
          python3 tools/check_ui_invariants.py --selftest
          python3 tools/check_ui_size.py --strict
          python3 tools/check_ui_size.py --selftest
          python3 tools/check_file_budget.py --strict
          python3 tools/check_file_budget.py --selftest
          python3 tools/check_i18n.py
          python3 tools/check_i18n.py --selftest
          python3 tools/check_ts_stale.py
          python3 tools/check_ts_stale.py --selftest
          python3 tools/check_qgis_versions.py
          python3 tools/check_qgis_versions.py --selftest
          python3 tools/check_ci_scripts.py
          python3 tools/check_ci_scripts.py --selftest
          python3 tools/check_docs_drift.py
          python3 tools/check_docs_drift.py --selftest
          # C++ 主线边界护栏（零 Python 依赖的 cmake -P 检查器，ctest 项
          # cpp_mainline/cpp_mainline_selftest 的 CI 权威闸口；规则见
          # docs/CPP_PRIMARY_BOUNDARY.md）。
          cmake -DCPP_MAINLINE_SOURCE_DIR=. -P cmake/verify-cpp-mainline.cmake
          cmake -DCPP_MAINLINE_SOURCE_DIR=. -DCPP_MAINLINE_SELFTEST=ON \
                -DCPP_MAINLINE_SELFTEST_DIR=/tmp/cpp-mainline-selftest \
                -P cmake/verify-cpp-mainline.cmake
      - name: deb-closure smoke (ET1：锁文件可解析、条目格式合法，零下载)
        run: ./vendor/fetch-deps.sh --print-only

  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          submodules: recursive
      # 磁盘：与 linux-asan 同款清理 + 水位闸（ci-repo-hygiene）——linux 必过 job 曾在链接期磁盘耗尽，测试未跑即红；早失败报明确原因。
      - name: Free disk space
        run: |
          echo "== df before =="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/lib/node_modules
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune -af >/dev/null || echo "docker image prune skipped"
          fi
          echo "== df after =="
          df -h
      - name: Disk space guard
        run: |
          avail_gb=$(( $(df --output=avail / | tail -1) / 1024 / 1024 ))
          echo "free: ${avail_gb} GB"
          if [ "$avail_gb" -lt 25 ]; then
            echo "::error::磁盘余量 ${avail_gb}GB < 25GB，linux 全量构建+链接会在链接期 No space left on device——先扩 Free disk space（#498 同口径）"
            exit 1
          fi
      # #76（方向 71）：QGIS/GDAL/PROJ/GEOS 不再走 apt 系统 QGIS（原 apt
      # 安装脚本已删）——bootstrap 统一拉 deb 闭包；apt 只装
      # 政策例外面（Qt6 发行版包/qtkeychain/ccache/工具链）。
      - name: Install Qt6 dev packages (vendored 路只缺 Qt/工具面)
        run: sudo apt-get update && sudo apt-get install -y
          qt6-base-dev qt6-5compat-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev
          qt6-webengine-dev qt6-pdf-dev qtkeychain-qt6-dev ccache ninja-build pkg-config patchelf
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-
      - name: Cache vendor artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: |
            vendor/onnxruntime
            vendor/cache/debs
            vendor/cache/lo
          key: ${{ runner.os }}-ort-${{ hashFiles('vendor/manifest.json') }}-debclosure-${{ hashFiles('vendor/deb-closure.lock', 'vendor/deb-packages.txt') }}
      - name: Vendor dependencies
        run: ./paleo-dev bootstrap fetch-only
      - name: Build
        id: build
        # Hundreds of full -g test executables exhausted the runner at final link.
        # Keep optimization and source/line stacks (-g1), without local-variable DWARF.
        # Configure the cache first; paleo-dev retains these flags on its own configure.
        run: |
          QGIS_PREFIX_PATH="$PWD/vendor/prefix/usr" \
          LD_LIBRARY_PATH="$PWD/vendor/prefix/usr/lib/x86_64-linux-gnu:$PWD/vendor/prefix/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            cmake -S . -B build -G Ninja \
              -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O2 -g1 -DNDEBUG'
          ./paleo-dev build
      # #501 flaky 台账跨 run 持久化：tools/flaky-ledger.jsonl 不入库（gitignore），
      # 此前每次 run 都从空台账起算，「同一测试累计 ≥3 次」永远到不了。restore 取
      # 最近一份，save 用 run 唯一 key（cache 不可覆盖写）且 always() 落盘——红 run
      # 的放行记录同样要累计。
      - name: Restore flaky ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: tools/flaky-ledger.jsonl
          key: ${{ runner.os }}-flaky-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-flaky-ledger-
      - name: Test (headless, isolated-module labels first)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
        # 并行轮失败时串行重跑失败项一次：QGIS 栈建/计时类在 -j 负载下
        # 有环境性抖动（本地串行全绿）；重跑仍挂才算真失败。::warning 留痕。
        # #81：崩溃（SegFault/abort）不重跑，直接判红——见 tools/ci_ctest_gate.sh。
        # #136：perf 标签不进必过门禁，见 linux-perf job。
        run: tools/ci_ctest_gate.sh -LE 'core|perf'
      # #81：上一步红时这一步也要跑（旧行为：core 段在 master 上从未执行过）。
      - name: Test (full-stack umbrella tests)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
        run: tools/ci_ctest_gate.sh -L core -LE perf
      - name: Save flaky ledger
        if: ${{ always() && hashFiles('tools/flaky-ledger.jsonl') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: tools/flaky-ledger.jsonl
          key: ${{ runner.os }}-flaky-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Selfcheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./paleo-dev selfcheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: selfcheck-linux
          path: vendor/logs/
      # 方向75：增量构建基线首测（PLAN ET14 口径）——全量树 touch 单文件
      # 计时。绝对时长只记录不设门（跨机不可比），tu_ratio/step_ratio 才是
      # 趋势口径（BUILDING.md「增量基线」段）。step 级 continue-on-error：
      # 观察面不许拖累合并门禁（preflight no-op 校验对 CONFIGURE_DEPENDS
      # 重扫抖动敏感，红了只丢趋势数据）。
      - name: Incremental build baseline (ET14)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: tools/measure_incremental.sh build src/app/appcontext.cpp build/incremental-baseline.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: incremental-baseline-linux
          if-no-files-found: ignore
          retention-days: 90
          path: build/incremental-baseline.jsonl
      # #150/#151：失败现场——ctest 完整日志、QtTest 落盘结果、黄金图当前渲染/差分。
      - name: Stage test diagnostics
        if: always()
        shell: bash
        run: |
          if [ -d build ]; then
            mkdir -p build/Testing/result-files
            find build -type f -name '*-result.txt' ! -path 'build/Testing/*' \
              -exec cp -f {} build/Testing/result-files/ \;
            if [ -d build/golden-out ]; then
              cp -a build/golden-out build/Testing/
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: test-logs-linux
          retention-days: 14
          if-no-files-found: ignore
          path: build/Testing/

  # #136 / #81 余项：墙钟预算类（ctest -L perf）单独、串行、非阻断；阈值不动，
  # 结果作 artifact 做趋势跟踪。红了不拖累合并门禁，但在 run 页面可见。
  linux-perf:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          submodules: recursive
      # 磁盘：与 linux-asan 同款清理 + 水位闸（ci-repo-hygiene）——同 linux 主 job 全量构建体量。
      - name: Free disk space
        run: |
          echo "== df before =="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/lib/node_modules
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune -af >/dev/null || echo "docker image prune skipped"
          fi
          echo "== df after =="
          df -h
      - name: Disk space guard
        run: |
          avail_gb=$(( $(df --output=avail / | tail -1) / 1024 / 1024 ))
          echo "free: ${avail_gb} GB"
          if [ "$avail_gb" -lt 25 ]; then
            echo "::error::磁盘余量 ${avail_gb}GB < 25GB，linux-perf 全量构建+链接会在链接期 No space left on device——先扩 Free disk space（#498 同口径）"
            exit 1
          fi
      # #76（方向 71）：同 linux job——QGIS 栈 vendored（deb 闭包），apt 只装
      # 政策例外面（Qt6 发行版包/qtkeychain/ccache/工具链）。
      - name: Install Qt6 dev packages (vendored 路只缺 Qt/工具面)
        run: sudo apt-get update && sudo apt-get install -y
          qt6-base-dev qt6-5compat-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev
          qt6-webengine-dev qt6-pdf-dev qtkeychain-qt6-dev ccache ninja-build pkg-config patchelf
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-perf-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-perf-
            ${{ runner.os }}-ccache-
      - name: Cache vendor artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: |
            vendor/onnxruntime
            vendor/cache/debs
            vendor/cache/lo
          key: ${{ runner.os }}-ort-${{ hashFiles('vendor/manifest.json') }}-debclosure-${{ hashFiles('vendor/deb-closure.lock', 'vendor/deb-packages.txt') }}
      - name: Vendor dependencies
        run: ./paleo-dev bootstrap fetch-only
      - name: Configure
        env:
          QGIS_PREFIX_PATH: ${{ github.workspace }}/vendor/prefix/usr
        # #762：与 linux 主 job 同口径的 -g1（仅行号表，无局部变量 DWARF）——
        # 该 job 仍全量构建（ci_perf.sh 只链 ~32 个 perf 目标，但构建面是全树），
        # 全量 -g 的调试段随静态库在 ~190 个可执行里逐个复制，链接期磁盘耗尽
        # （#498/#505 同款事故）；continue-on-error 只让它「不拖累合并门禁」，
        # 失败仍会静默丢趋势数据。
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO='-O2 -g1 -DNDEBUG'
      - name: Build + run perf tests (serial)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
          # ci_perf.sh 走裸 ctest 不经 paleo-dev 注入——deb 闭包的
          # PROJ/GDAL 数据目录在此显式接线（同 windows paleo-dev.ps1
          # 口径），否则 proj.db 找不到、写栅格/CRS 用例成片红。
          QGIS_PREFIX_PATH: ${{ github.workspace }}/vendor/prefix/usr
          PROJ_DATA: ${{ github.workspace }}/vendor/prefix/usr/share/proj
          PROJ_LIB: ${{ github.workspace }}/vendor/prefix/usr/share/proj
          GDAL_DATA: ${{ github.workspace }}/vendor/prefix/usr/share/gdal
        run: tools/ci_perf.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: perf-results-linux
          if-no-files-found: ignore
          path: |
            build/perf-results/
            build/Testing/Temporary/LastTest*.log

  # 方向70：sanitizer 常态化观察档（devex.md build-asan 手动轮 → CI 化）。
  # ASAN+UBSAN 全量编译 + 串行 ctest；CMake 侧注入 PALEO_SANITIZER_BUILD，
  # 三个 budget 测试自动降档/跳过（tests/perfbudget_relax.h）。
  # continue-on-error 起步：先攒稳定性数据（Qt 内部 UBSAN 告警等已知面，
  # devex 实测 3 处 qpointer.h downcast），稳定后转阻断。
  linux-asan:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    continue-on-error: true
    steps:
      # 方向75：原「Install QGIS 4.2 development packages」步 run 的是方向 71
      # 已删除的 apt 安装脚本（该死脚本名已从全文清除，rg 零命中），安装步
      # 即红并被 continue-on-error 吞掉——asan 档自方向 70 合入起从未跑进编译
      # 步。依赖步顺序现逐行对拍 linux 主 job vendored 路：apt 只装政策例外
      # 面，QGIS 栈走 bootstrap 拉 deb 闭包（tools/check_ci_scripts.py 守
      # 引用存在性，防再断链）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          submodules: recursive
      # 磁盘：PR #496 run 38880554660 / master ddd1325e run 38835970978 的
      # asan 档均在 ~1970/2231 链接步 "No space left on device"（清理后
      # /dev/root 106G 可用仍耗尽）。大头是 -g 全量调试信息随静态库在 ~190
      # 个可执行（多为测试）里逐个复制；清理只是余量，主手段见 Configure 的 -gz。
      - name: Free disk space
        run: |
          echo "== df before =="
          df -h /
          # #505 已删 dotnet/android/ghc/powershell/ghcup/CodeQL/swift；#498 再补
          # 托管工具缓存其余部分与 node_modules（本 job 用不到，约再省 10GB+）。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/lib/node_modules
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune -af >/dev/null || echo "docker image prune skipped"
          fi
          echo "== df after =="
          df -h
      # #498：磁盘水位闸——余量不足时**早失败并报明确原因**。此前这里只会在链接期
      # 报 "final link failed: No space left on device"，容易被误读为代码/工具链问题。
      - name: Disk space guard
        run: |
          avail_gb=$(( $(df --output=avail / | tail -1) / 1024 / 1024 ))
          echo "free: ${avail_gb} GB"
          if [ "$avail_gb" -lt 40 ]; then
            echo "::error::磁盘余量 ${avail_gb}GB < 40GB，ASAN+UBSAN 全量链接必然失败——先扩 Free disk space 再跑构建（#498）"
            exit 1
          fi
      - name: Install Qt6 dev packages (vendored 路只缺 Qt/工具面)
        run: sudo apt-get update && sudo apt-get install -y
          qt6-base-dev qt6-5compat-dev qt6-svg-dev qt6-serialport-dev qt6-positioning-dev qt6-tools-dev
          qt6-webengine-dev qt6-pdf-dev qtkeychain-qt6-dev ccache ninja-build pkg-config
          && sudo apt-get clean
      # 不再回落 restore 非 asan 的 Linux-ccache-*（linux 主 job 产物）：
      # 编译旗标不同零命中，白占 ~3G 下载与磁盘。
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-asan-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-asan-
      - name: Cache vendor artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: |
            vendor/onnxruntime
            vendor/cache/debs
            vendor/cache/lo
          key: ${{ runner.os }}-ort-${{ hashFiles('vendor/manifest.json') }}-debclosure-${{ hashFiles('vendor/deb-closure.lock', 'vendor/deb-packages.txt') }}
      - name: Vendor dependencies
        run: ./paleo-dev bootstrap fetch-only
      # 裸跑 cmake 不经 paleo-dev 顶部的 QGIS_PREFIX_PATH 自动注入（linux
      # 主 job 用 ./paleo-dev build 自带；linux-perf 的 Configure 同样显式给）。
      # -gz：目标文件与链接产物的调试段 zlib 压缩（调试信息不减，ASan 栈的
      # 文件:行号符号化不受影响），只作用于本 job，不改 CMakeLists 默认。
      # review-fix-ci：-gz 仍在 ~2225/2479 链接步磁盘耗尽——再把调试级降到
      # -g1（仅行号表，ASan/UBSan 栈仍有 文件:行号，丢的是局部变量/类型信息），
      # 调试段体量约降一个量级。
      - name: Configure (ASAN+UBSAN)
        env:
          QGIS_PREFIX_PATH: ${{ github.workspace }}/vendor/prefix/usr
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPALEO_ENABLE_ASAN=ON -DPALEO_ENABLE_UBSAN=ON
          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g1 -DNDEBUG"
          -DPALEO_SANITIZER_DEBUG_FLAG=-g1
          -DCMAKE_C_FLAGS=-gz -DCMAKE_CXX_FLAGS=-gz
          -DCMAKE_EXE_LINKER_FLAGS=-gz -DCMAKE_SHARED_LINKER_FLAGS=-gz -DCMAKE_MODULE_LINKER_FLAGS=-gz
      - name: Build
        run: cmake --build build --parallel 8
      - name: Disk usage after build
        if: always()
        run: |
          df -h /
          du -sh build ~/.cache/ccache vendor 2>/dev/null || true
      # 走 ./paleo-dev test 而非裸 ctest：vendored 路测试期需要 deb 库路径 /
      # QGIS_PREFIX_PATH / GDAL_DRIVER_PATH 注入（与 linux 主 job 同源）；
      # ASAN_OPTIONS 经 env 透传，串行 -j 1 语义不变。
      # PW-030：LSAN 打开，QGIS/Qt 设计内“泄漏”走 tools/lsan-suppressions.txt；
      # UBSAN halt_on_error 让 UB 直接判红。本 job 仍 continue-on-error（观察档），
      # 连续绿后再列入 ci-gate needs（见 ledger 手工步骤）。
      - name: Test (serial, LSAN on with suppressions, UBSAN halting)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/onnxruntime/lib
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan-suppressions.txt:print_suppressions=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./paleo-dev test -j 1 --output-on-failure
      - name: Stage test diagnostics
        if: always()
        shell: bash
        run: |
          if [ -d build ]; then
            mkdir -p build/Testing/result-files
            find build -type f -name '*-result.txt' ! -path 'build/Testing/*' \
              -exec cp -f {} build/Testing/result-files/ \;
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: test-logs-linux-asan
          retention-days: 14
          if-no-files-found: ignore
          path: build/Testing/

  # #646：单 job 串行 432 项超 6h 预算。按 ctest 序号四等分，片内仍串行
  # （QSettings NativeFormat 不跨进程隔离）。required check 名仍是下面的 windows。
  windows-shard:
    # PW-058：固定 runner 镜像，升级 = 有意改这里。
    runs-on: windows-2025
    # R6 测试管控（用户 2026-10-31「一定要控制测试」）：实测 Build 68–100 min，
    # 片内测试正常 <60 min；挂死不再吊满 6h——Test 步自身 90 min 上限，job 200 min。
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          submodules: recursive
      - name: Cache vendor artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          # #231：osgeo4w 安装树随包钉版缓存（key 已含 manifest.json 哈希，
          # 钉版变更自动 bust）；命中时 bootstrap 直接跳过 setup。
          path: |
            vendor/onnxruntime
            vendor/cache
            vendor/osgeo4w
          key: ${{ runner.os }}-vendor-${{ hashFiles('vendor/manifest.json') }}
      # #134：Vendor 只取依赖；编译错误落在 Build 步骤（CI 下 ninja -k 0 一次暴露全部错误）。
      - name: Vendor dependencies (OSGeo4W route per docs/phase0/et0-vendor-comparison.md)
        shell: pwsh
        run: ./paleo-dev.ps1 bootstrap fetch-only
      # #501/#759：flaky 台账跨 run 持久化（key 带分片号）。此前 Windows 每次 run
      # 从空台账起算，「同一测试累计 ≥3 次点名」永远达不到、#501 在 Windows 只剩
      # 单次 warning。按 ctest -I shard,,4 的分片是稳定划分（同一测试恒落同一片），
      # 故按分片各自累计即可得到跨 run 的命中次数。
      - name: Restore flaky ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: tools/flaky-ledger.jsonl
          key: ${{ runner.os }}-flaky-ledger-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-flaky-ledger-${{ matrix.shard }}-
      - name: Build (MSVC + vendored QGIS)
        id: build
        shell: pwsh
        run: ./paleo-dev.ps1 build
      - name: Selfcheck
        if: matrix.shard == 1
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./paleo-dev.ps1 selfcheck
      - name: Test (headless；QSettings 走测试私有注册表 hive（方向 81），片内串行)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        # 挂死快速判红：单测 ctest TIMEOUT 默认 300s（cmake PALEO_TEST_TIMEOUT，--timeout
        # 兜底无属性项），整步 90 min 硬上限。不用 --stop-on-failure：它会让 flaky 直跑放行
        # 后其余未跑的测试被当成通过（#501 台账语义）。
        timeout-minutes: 90
        env:
          QT_QPA_PLATFORM: offscreen
          # -I start,,stride：四片各跑 1/4，片内保持串行。perf 仍不进必过门禁。
          PALEO_CTEST_ARGS: "-LE perf --timeout 300 -I ${{ matrix.shard }},,4"
        run: ./paleo-dev.ps1 test
      # #501/#759：红 run 的放行记录同样要累计，故 always() 落盘。
      - name: Save flaky ledger
        if: ${{ always() && hashFiles('tools/flaky-ledger.jsonl') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (node24)
        with:
          path: tools/flaky-ledger.jsonl
          key: ${{ runner.os }}-flaky-ledger-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: selfcheck-windows-${{ matrix.shard }}
          path: vendor/logs/
      - name: Stage test diagnostics
        if: always()
        shell: pwsh
        run: |
          $build = Join-Path $PWD 'build'
          if (Test-Path $build) {
            $testing = Join-Path $build 'Testing'
            $resultDir = Join-Path $testing 'result-files'
            New-Item -ItemType Directory -Force $resultDir | Out-Null
            Get-ChildItem -Path $build -Recurse -File -Filter '*-result.txt' |
              Where-Object { $_.FullName -notlike "$testing*" } |
              Copy-Item -Destination $resultDir -Force
            $golden = Join-Path $build 'golden-out'
            if (Test-Path $golden) {
              Copy-Item -Path $golden -Destination $testing -Recurse -Force
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: test-logs-windows-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: ignore
          path: build/Testing/

  # required check 名保持 windows。分片失败在这里汇总，日志并回 test-logs-windows。
  windows:
    runs-on: ubuntu-26.04
    needs: [windows-shard]
    if: always()
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Merge Windows shard logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p redlogs/windows
          for shard in 1 2 3 4; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "test-logs-windows-$shard" --dir "redlogs/windows/shard-$shard" \
              || echo "::warning::test-logs-windows-$shard 缺失"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: test-logs-windows
          retention-days: 14
          if-no-files-found: ignore
          path: redlogs/windows/
      - name: Require every Windows test shard
        if: always()
        run: |
          result='${{ needs.windows-shard.result }}'
          echo "windows-shard: $result"
          test "$result" = "success"

  # PW-001：单一 required context「ci-gate」。分支保护只需要求这一个检查名
  #（矩阵分片名 windows-shard (n) / 重命名 job 都不会再导致 required context
  # 与实际 job 名错位而“永远 pending 也能被管理员合并”）。任一 gating 车道
  # 非 success（含 skipped/cancelled）即红。观察档 linux-perf/linux-asan 不在内。
  ci-gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [lint, linux, windows]
    if: ${{ always() }}
    steps:
      - name: Require all gating lanes green
        env:
          LINT: ${{ needs.lint.result }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "lint=$LINT linux=$LINUX windows=$WINDOWS"
          rc=0
          for pair in "lint:$LINT" "linux:$LINUX" "windows:$WINDOWS"; do
            if [ "${pair#*:}" != "success" ]; then
              echo "::error title=ci-gate::${pair%%:*} 车道结论为 ${pair#*:}——master 红即停线（PW-001）"
              rc=1
            fi
          done
          exit $rc

  # #497/#475：红项分诊汇总 job。master 长期全红期间，把红拆成两类——
  # docs/ci/known-reds.json 登记的已知红项降级 ::warning + issue 链接；
  # 未知红项才让本 job 红。不改动 lint/linux/windows 的判定语义（required
  # check context 名零变化）；本 job 是新增 context，未列入 required checks
  # 前不阻断合入——先恢复「红得明白」的单点信号（#497 的 windows+linux
  # 必绿门禁恢复是分支保护决策，不在 yml 层强推）。
  # 观察档（linux-perf/linux-asan，continue-on-error）的 job 级真实 conclusion
  # 每轮在此点名（needs 上下文里它们恒 success，只有 Actions API 可见）——
  # #484 P2「asan 断链静默腐烂」的每轮状态追踪位。
  triage:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [lint, linux, linux-perf, linux-asan, windows]
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          submodules: recursive
          fetch-depth: 0 # known-reds diff notice 需要 base 可达（同 lint tidy 口径）
      # #497：known-reds 变更须 PR 显式——对 docs/ci/known-reds.json 的 paths
      # diff 输出 ::notice 点名（新增/删除/预算调整必须随 PR 评审，不允许在
      # 分诊未过时悄悄扩名单）。
      - name: known-reds diff notice
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_REF" ]; then
            base="origin/$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="HEAD~1"
          fi
          echo "known-reds diff base: $base"
          if git diff --quiet "$base" -- docs/ci/known-reds.json; then
            echo "docs/ci/known-reds.json 无变更。"
          else
            {
              echo "::notice title=known-reds 名单变更（#497 分诊清单）::docs/ci/known-reds.json 相对 ${base} 有变更——已知红项的增删/预算调整/续期必须随本 PR 显式评审："
              git diff "$base" -- docs/ci/known-reds.json \
                | grep -E '^[+-][^+-]' || true
            }
          fi
      # 各车道测试日志（同 run artifact，best-effort：早期失败的车道没有产物，
      # 该车道按无测试级明细参与分诊——job 级红路径接管）。
      - name: Download lane test logs (best effort)
        run: |
          mkdir -p redlogs
          for lane in linux windows; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "test-logs-$lane" --dir "redlogs/$lane" \
              || echo "::warning::test-logs-$lane artifact 缺失（该车道早期失败），按无测试明细分诊"
          done
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name perf-results-linux --dir redlogs/linux-perf \
            || echo "NOTE perf-results-linux 缺失，linux-perf 按无明细分诊"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name test-logs-linux-asan --dir redlogs/linux-asan \
            || echo "NOTE test-logs-linux-asan 缺失，linux-asan 按无明细分诊"
      # job 级真实结论（continue-on-error 车道只有这里可见）。
      - name: Fetch job conclusions
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100"
          > jobs.json
      # 分诊本体：已知红降级 warning + issue 链接 + golden 预算只缩不涨（#475）；
      # 未知红（gating 车道）/预算超涨/复审到期才 exit 1。golden 明细汇总
      #（GOLDEN-SUMMARY/GOLDEN-DIFF，tests/tst_wellcomposite_visual 输出）写入
      # step summary。
      - name: Triage reds against docs/ci/known-reds.json
        run: |
          python3 tools/ci_triage_reds.py --jobs jobs.json \
            --logs linux=redlogs/linux \
            --logs windows=redlogs/windows \
            --logs linux-perf=redlogs/linux-perf \
            --logs linux-asan=redlogs/linux-asan
