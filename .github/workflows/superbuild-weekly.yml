# superbuild 首选依赖路线的干净环境周检（#561 项4）。
# BUILDING.md「依赖来源策略」第 1 档自述「尚无 CI 覆盖，端到端未在干净环境
# 验证」——四钉位（GEOS/PROJ/GDAL/QGIS 的 URL+SHA256）与 QGIS 补丁应用
#（labels-with-layer）此前只有本机人工验证，护不住「钉位腐烂/补丁随版本
# 失配/裁剪面漂移」。这里每周从零 configure+build 一轮（ExternalProject
# stamp 全新——干净环境即意义，不做增量缓存），并在收尾探针 prefix 产物。
# 预算口径 vendor/superbuild/README.md：8 核基线机 ≤2h、磁盘 ≥60GB——
# runner 4 核放宽 timeout，磁盘靠清理步 + ${{ runner.temp }} 建构建树。
# 独立 workflow，不进 required checks（同 deb-lock 先例）。
name: superbuild-weekly

on:
  schedule:
    - cron: '23 2 * * 0'   # 每周日 02:23 UTC（错开 deb-lock 的周一 03:17）
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/superbuild/**'
      - '.github/workflows/superbuild-weekly.yml'

permissions:
  contents: read
  issues: write # #874：失败时自动开追踪 issue

jobs:
  clean-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      # 磁盘：superbuild ≥60GB 口径（README）——同 ci.yml linux-asan 的清理面。
      - name: Free disk space
        run: |
          echo "== df before =="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/lib/node_modules
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune -af >/dev/null || echo "docker image prune skipped"
          fi
          echo "== df after =="
          df -h /
      - name: Disk space guard
        run: |
          avail_gb=$(( $(df --output=avail / | tail -1) / 1024 / 1024 ))
          echo "free: ${avail_gb} GB"
          if [ "$avail_gb" -lt 60 ]; then
            echo "::error::磁盘余量 ${avail_gb}GB < 60GB，superbuild（≥60GB 口径）必然失败——先扩 Free disk space 再跑（同 ci.yml linux-asan #498 口径）"
            exit 1
          fi
      # Qt6 走发行版包（superbuild 决策 D-QT：禁止 qt-everywhere 整块编译）；
      # flex/bison/nasm/python3 是 README preflight 追加检查项；其余为
      # PROJ(curl/sqlite) / GDAL / QGIS(expat/zip/ssl/X11/GL) 的系统开发面。
      # review-fix-ci：近 3 次 weekly 均在 QGIS configure「Could NOT find Protobuf」
      # 停住。按 QGIS final-4_2_3 顶层 CMakeLists 的 find_package 面补齐
      # protobuf / nlohmann_json / exiv2 / GeographicLib / SpatiaLite / ZSTD /
      # Draco / GSL / tasn1 / QScintilla / Qt6Keychain / QCA / Qt 私有与模块包
      # （包名均在 resolute apt 索引核对存在；qwt/poly2tri 无 resolute 包，走 QGIS 内置）。
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y
          cmake ninja-build g++ pkg-config ccache
          qt6-base-dev qt6-svg-dev qt6-serialport-dev qt6-tools-dev qt6-5compat-dev
          flex bison nasm python3
          libsqlite3-dev libtiff-dev libcurl4-openssl-dev libssl-dev libexpat1-dev libzip-dev
          libx11-dev libxkbcommon-dev libgl1-mesa-dev libopengl-dev
          libprotobuf-dev protobuf-compiler nlohmann-json3-dev zlib1g-dev libzstd-dev
          libexiv2-dev libgeographiclib-dev libspatialite-dev libdraco-dev libgsl-dev libtasn1-6-dev libpq-dev
          qt6-base-private-dev qt6-positioning-dev qt6-declarative-dev qt6-multimedia-dev qt6-webengine-dev
          libqscintilla2-qt6-dev qtkeychain-qt6-dev libqca-qt6-dev
          && sudo apt-get clean
      - name: Configure superbuild
        run: cmake -S vendor/superbuild -B "${RUNNER_TEMP}/sb-build" -G Ninja
      # 入口命令见 vendor/superbuild/README.md「启用步骤」（ninja 增量即
      # ExternalProject stamp 断点续跑；本 job 每次全新构建树 = 干净口径）。
      - name: Build superbuild (GEOS → PROJ → GDAL → QGIS)
        run: cmake --build "${RUNNER_TEMP}/sb-build" -j 4
      - name: Prefix sanity probe
        run: |
          prefix="${GITHUB_WORKSPACE}/vendor/superbuild/prefix"
          test -d "${prefix}/include/qgis" || { echo "::error::${prefix}/include/qgis 缺失"; exit 1; }
          test -e "${prefix}/lib/libqgis_core.so" || { echo "::error::libqgis_core.so 缺失"; exit 1; }
          echo "prefix 产物探针通过："
          ls "${prefix}/lib/" | grep -E 'qgis_(core|gui|analysis)' || true
      # #874：定时/手动跑红时不再静默——开（或复用已开的）追踪 issue 并写
      # 可操作摘要。PR 触发不开 issue（红在 PR 检查里本就可见）。本 workflow
      # 仍不进 required checks。按标题去重，避免每周叠一张新 issue。
      - name: Open tracking issue on failure
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="superbuild-weekly 周检失败（自动开单，#874）"
          body="workflow \`${GITHUB_WORKFLOW}\` 在 ${GITHUB_SHA} 上判红：${RUN_URL}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            echo "::error::superbuild-weekly 红——已有追踪 issue #$existing（未重复开单）：$RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "::error::superbuild-weekly 红——已开追踪 issue：$RUN_URL"
          fi
          {
            echo "## superbuild-weekly 失败"
            echo "- run: $RUN_URL"
            echo "- 处置：看红步（钉位 URL/SHA 腐烂、QGIS 补丁失配或缺 apt 依赖），口径见 vendor/superbuild/README.md；修复后手动关闭追踪 issue"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Disk usage after build
        if: always()
        run: |
          df -h /
          du -sh "${RUNNER_TEMP}/sb-build" "${GITHUB_WORKSPACE}/vendor/superbuild/prefix" 2>/dev/null || true
