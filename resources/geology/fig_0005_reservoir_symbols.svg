<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1600" width="1400" height="1600">
  <defs>
    <style>
      .title { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-family: SimSun, serif; font-size: 13px; fill: #666; }
      .category { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 15px; font-weight: bold; fill: #1a6b8a; }
      .label { font-family: SimSun, serif; font-size: 12px; fill: #1a1a1a; }
      .code { font-family: Arial, sans-serif; font-size: 10px; fill: #888; }
      .desc { font-family: SimSun, serif; font-size: 11px; fill: #444; }
      .remark { font-family: SimSun, serif; font-size: 10px; fill: #999; }
      .cell-border { fill: none; stroke: #ccc; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1600" fill="#fafafa"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title">油气层符号库</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">Oil-Gas Reservoir Symbol Library — Q/HS 1011—2016 附录 L</text>

  <!-- ========== 接触关系 Contact Relationships ========== -->
  <text x="20" y="85" class="category">一、接触关系 (Contact Relationships) — 附录 L.1</text>
  <rect x="15" y="88" width="1370" height="160" class="cell-border"/>

  <text x="30" y="115" class="label">整合接触</text>
  <text x="30" y="130" class="desc">Conformable Contact</text>
  <text x="30" y="143" class="code">JZGX-L1-1H/C</text>
  <g transform="translate(250, 100)">
    <line x1="0" y1="10" x2="120" y2="10" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="20" x2="120" y2="20" stroke="#000" stroke-width="2"/>
  </g>

  <text x="600" y="115" class="label">平行不整合接触</text>
  <text x="600" y="130" class="desc">Parallel Unconformity</text>
  <text x="600" y="143" class="code">JZGX-L1-2H/C</text>
  <g transform="translate(820, 100)">
    <line x1="0" y1="10" x2="120" y2="10" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="20" x2="120" y2="20" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
    <!-- wavy line for erosion -->
    <path d="M 20,25 Q 30,22 40,25 Q 50,28 60,25 Q 70,22 80,25" fill="none" stroke="#000" stroke-width="1"/>
  </g>

  <text x="30" y="190" class="label">角度不整合接触</text>
  <text x="30" y="205" class="desc">Angular Unconformity</text>
  <text x="30" y="218" class="code">JZGX-L1-3H/C</text>
  <g transform="translate(250, 175)">
    <line x1="0" y1="5" x2="80" y2="25" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="15" x2="80" y2="15" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="15" x2="120" y2="25" stroke="#000" stroke-width="1" stroke-dasharray="5,3"/>
    <path d="M 20,30 Q 30,27 40,30 Q 50,33 60,30" fill="none" stroke="#000" stroke-width="1"/>
  </g>

