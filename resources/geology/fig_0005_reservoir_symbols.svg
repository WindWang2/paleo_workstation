  <!-- Reservoir interval pinchout -->
  <text x="600" y="615" class="label">储层断层尖厚</text>
  <text x="600" y="630" class="desc">Reservoir Interval Pinchout</text>
  <text x="600" y="643" class="code">YQSC-E2-11H/C</text>
  <g transform="translate(820, 600)">
