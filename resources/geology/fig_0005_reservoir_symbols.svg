    <rect x="30" y="10" width="30" height="20" fill="#90EE90" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Gas layer -->
  <text x="30" y="425" class="label">气层</text>
  <text x="30" y="440" class="desc">Gas Layer</text>
  <text x="30" y="453" class="code">YQSC-E2-5H/C</text>
  <g transform="translate(250, 400)">
    <rect x="0" y="10" width="120" height="20" fill="#FF9900" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Possible gas layer -->
  <text x="600" y="425" class="label">可能气层</text>
  <text x="600" y="440" class="desc">Possible Gas Layer</text>
  <text x="600" y="453" class="code">YQSC-E2-6H/C</text>
  <g transform="translate(820, 400)">
    <rect x="0" y="10" width="120" height="20" fill="#FF9900" stroke="#000" stroke-width="1"/>
    <circle cx="20" cy="20" r="3" fill="#000"/>
    <circle cx="50" cy="20" r="3" fill="#000"/>
    <circle cx="80" cy="20" r="3" fill="#000"/>
  </g>

  <!-- Gas-water same layer -->
  <text x="30" y="485" class="label">气水同层</text>
  <text x="30" y="500" class="desc">Gas-Water Same Layer</text>
  <text x="30" y="513" class="code">YQSC-E2-7H/C</text>
  <g transform="translate(250, 460)">
    <rect x="0" y="10" width="120" height="20" fill="#FF9900" stroke="#000" stroke-width="1"/>
    <rect x="60" y="10" width="60" height="20" fill="#0082FF" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Water layer -->
  <text x="600" y="485" class="label">水层</text>
  <text x="600" y="500" class="desc">Water Layer</text>
  <text x="600" y="513" class="code">YQSC-E2-8H/C</text>
  <g transform="translate(820, 460)">
