  <text x="30" y="920" class="desc">Gas Soaking</text>
  <text x="30" y="933" class="code">LJCZ-L3-7H/C</text>
  <g transform="translate(200, 890)">
    <rect x="5" y="10" width="50" height="30" fill="#FFE4B5" stroke="#000" stroke-width="1"/>
    <text x="30" y="30" text-anchor="middle" font-size="12" fill="#FF6600">浸</text>
  </g>

  <text x="400" y="905" class="label">气斑</text>
  <text x="400" y="920" class="desc">Gas Stain</text>
  <text x="400" y="933" class="code">LJCZ-L3-8H/C</text>
  <g transform="translate(570, 890)">
    <rect x="5" y="10" width="50" height="30" fill="#FFE4B5" stroke="#000" stroke-width="1"/>
