    <rect x="60" y="10" width="60" height="20" fill="#0082FF" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Water-oil layer -->
  <text x="600" y="365" class="label">含油水层</text>
  <text x="600" y="380" class="desc">Oil-Bearing Water Layer</text>
  <text x="600" y="393" class="code">YQSC-E2-4H/C</text>
  <g transform="translate(820, 340)">
