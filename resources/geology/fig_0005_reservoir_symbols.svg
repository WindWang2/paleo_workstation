  <text x="30" y="320" class="desc">Possible Oil Layer</text>
  <text x="30" y="333" class="code">YQSC-E2-1H/C</text>
  <g transform="translate(250, 280)">
    <rect x="0" y="10" width="120" height="20" fill="#90EE90" stroke="#000" stroke-width="1"/>
    <circle cx="20" cy="20" r="3" fill="#000"/>
    <circle cx="50" cy="20" r="3" fill="#000"/>
    <circle cx="80" cy="20" r="3" fill="#000"/>
  </g>

  <!-- Possible gas -->
  <text x="600" y="305" class="label">可能气层</text>
  <text x="600" y="320" class="desc">Possible Gas Layer</text>
  <text x="600" y="333" class="code">YQSC-E2-2H/C</text>
  <g transform="translate(820, 280)">
    <rect x="0" y="10" width="120" height="20" fill="#90EE90" stroke="#000" stroke-width="1"/>
    <circle cx="20" cy="20" r="3" fill="#FF9900"/>
    <circle cx="50" cy="20" r="3" fill="#FF9900"/>
    <circle cx="80" cy="20" r="3" fill="#FF9900"/>
