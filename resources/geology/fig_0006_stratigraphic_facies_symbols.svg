<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1500" width="1400" height="1500">
  <defs>
    <style>
      .title { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-family: SimSun, serif; font-size: 13px; fill: #666; }
      .category { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 15px; font-weight: bold; fill: #8a6b1a; }
      .label { font-family: SimSun, serif; font-size: 12px; fill: #1a1a1a; }
      .code { font-family: Arial, sans-serif; font-size: 10px; fill: #888; }
      .desc { font-family: SimSun, serif; font-size: 11px; fill: #444; }
      .remark { font-family: SimSun, serif; font-size: 10px; fill: #999; }
      .cell-border { fill: none; stroke: #ccc; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1500" fill="#fafafa"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title">地层单位与沉积相符号库</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">Stratigraphic Unit &amp; Sedimentary Facies Symbol Library — Q/HS 1011—2016 附录 N, O</text>

  <!-- ========== 地层单位 Stratigraphic Units ========== -->
  <text x="20" y="85" class="category">一、地层单位 (Stratigraphic Units) — 附录 N</text>
  <rect x="15" y="88" width="1370" height="340" class="cell-border"/>

  <!-- 第四系 Quaternary -->
  <text x="30" y="115" class="label">第四系</text>
  <text x="30" y="130" class="desc">Quaternary</text>
  <text x="30" y="143" class="code">DCND-N1-1C</text>
  <g transform="translate(250, 100)">
    <rect x="0" y="5" width="120" height="25" fill="#f5ecd7" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">Q</text>
  </g>

  <!-- 新近系 Neogene -->
  <text x="600" y="115" class="label">新近系</text>
  <text x="600" y="130" class="desc">Neogene</text>
  <text x="600" y="143" class="code">DCND-N1-2C</text>
  <g transform="translate(820, 100)">
    <rect x="0" y="5" width="120" height="25" fill="#FFE4B5" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">N</text>
  </g>

  <!-- 古近系 Paleogene -->
  <text x="30" y="185" class="label">古近系</text>
  <text x="30" y="200" class="desc">Paleogene</text>
  <text x="30" y="213" class="code">DCND-N1-3C</text>
  <g transform="translate(250, 170)">
    <rect x="0" y="5" width="120" height="25" fill="#B0E0E6" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">E</text>
  </g>

  <!-- 白垩系 Cretaceous -->
  <text x="600" y="185" class="label">白垩系</text>
  <text x="600" y="200" class="desc">Cretaceous</text>
  <text x="600" y="213" class="code">DCND-N1-4C</text>
  <g transform="translate(820, 170)">
    <rect x="0" y="5" width="120" height="25" fill="#DEB887" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">K</text>
  </g>

  <!-- 侏罗系 Jurassic -->
  <text x="30" y="255" class="label">侏罗系</text>
  <text x="30" y="270" class="desc">Jurassic</text>
  <text x="30" y="283" class="code">DCND-N1-5C</text>
  <g transform="translate(250, 240)">
    <rect x="0" y="5" width="120" height="25" fill="#D2B48C" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">J</text>
  </g>

  <!-- 三叠系 Triassic -->
  <text x="600" y="255" class="label">三叠系</text>
  <text x="600" y="270" class="desc">Triassic</text>
  <text x="600" y="283" class="code">DCND-N1-6C</text>
  <g transform="translate(820, 240)">
    <rect x="0" y="5" width="120" height="25" fill="#C8A882" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">T</text>
  </g>

  <!-- 二叠系 Permian -->
  <text x="30" y="325" class="label">二叠系</text>
  <text x="30" y="340" class="desc">Permian</text>
  <text x="30" y="353" class="code">DCND-N1-7C</text>
  <g transform="translate(250, 310)">
    <rect x="0" y="5" width="120" height="25" fill="#C0A080" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">P</text>
  </g>

  <!-- 石炭系 Carboniferous -->
  <text x="600" y="325" class="label">石炭系</text>
  <text x="600" y="340" class="desc">Carboniferous</text>
  <text x="600" y="353" class="code">DCND-N1-8C</text>
  <g transform="translate(820, 310)">
    <rect x="0" y="5" width="120" height="25" fill="#B89878" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">C</text>
  </g>

  <!-- 泥盆系 Devonian -->
  <text x="30" y="395" class="label">泥盆系</text>
  <text x="30" y="410" class="desc">Devonian</text>
  <text x="30" y="423" class="code">DCND-N1-9C</text>
  <g transform="translate(250, 380)">
    <rect x="0" y="5" width="120" height="25" fill="#B09070" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">D</text>
  </g>

  <!-- 志留系 Silurian -->
  <text x="600" y="395" class="label">志留系</text>
  <text x="600" y="410" class="desc">Silurian</text>
  <text x="600" y="423" class="code">DCND-N1-10C</text>
  <g transform="translate(820, 380)">
    <rect x="0" y="5" width="120" height="25" fill="#A88868" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">S</text>
  </g>

  <!-- 奥陶系 Ordovician -->
  <text x="30" y="465" class="label">奥陶系</text>
  <text x="30" y="480" class="desc">Ordovician</text>
  <text x="30" y="493" class="code">DCND-N1-11C</text>
  <g transform="translate(250, 450)">
    <rect x="0" y="5" width="120" height="25" fill="#A08060" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">O</text>
  </g>

  <!-- 寒武系 Cambrian -->
  <text x="600" y="465" class="label">寒武系</text>
  <text x="600" y="480" class="desc">Cambrian</text>
  <text x="600" y="493" class="code">DCND-N1-12C</text>
  <g transform="translate(820, 450)">
    <rect x="0" y="5" width="120" height="25" fill="#987858" stroke="#999" stroke-width="1"/>
    <text x="60" y="23" text-anchor="middle" font-size="12" fill="#333">∈</text>
  </g>

  <!-- 元古界 Proterozoic -->
  <text x="30" y="535" class="label">元古界</text>
  <text x="30" y="550" class="desc">Proterozoic</text>
