  <text x="30" y="765" class="desc">Delta Facies</text>
  <text x="30" y="778" class="code">SJZ-O2-2C</text>
  <g transform="translate(250, 730)">
    <polygon points="60,5 120,30 0,30" fill="#E8D5B0" stroke="#B8956A" stroke-width="1.5"/>
