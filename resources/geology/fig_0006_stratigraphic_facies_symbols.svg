  <!-- ========== 沉积相 Sedimentary Facies ========== -->
  <text x="20" y="600" class="category">二、沉积相 (Sedimentary Facies) — 附录 O</text>
  <rect x="15" y="603" width="1370" height="440" class="cell-border"/>

  <!-- Continental facies -->
  <text x="30" y="630" class="label">陆相沉积</text>
  <text x="30" y="645" class="desc">Continental Facies</text>
  <text x="30" y="658" class="code">CJX-O1-1C</text>
  <g transform="translate(250, 610)">
    <rect x="0" y="5" width="120" height="25" fill="#E8D5B0" stroke="#B8956A" stroke-width="1.5"/>
  </g>

  <!-- Fluvial -->
  <text x="600" y="630" class="label">河流相</text>
  <text x="600" y="645" class="desc">Fluvial Facies</text>
  <text x="600" y="658" class="code">CJX-O1-5C</text>
  <g transform="translate(820, 610)">
    <rect x="0" y="5" width="120" height="25" fill="#E8D5B0" stroke="#B8956A" stroke-width="1.5"/>
    <!-- winding line pattern -->
    <path d="M 10,17 Q 30,10 50,17 T 90,17" fill="none" stroke="#B8956A" stroke-width="1.5"/>
  </g>

  <!-- Lacustrine -->
  <text x="30" y="690" class="label">湖泊相</text>
  <text x="30" y="705" class="desc">Lacustrine Facies</text>
  <text x="30" y="718" class="code">CJX-O1-6C</text>
  <g transform="translate(250, 670)">
    <rect x="0" y="5" width="120" height="25" fill="#D5E8D0" stroke="#6AAE6A" stroke-width="1.5"/>
    <!-- ripple pattern -->
    <path d="M 10,12 Q 20,8 30,12 Q 40,16 50,12 Q 60,8 70,12" fill="none" stroke="#6AAE6A" stroke-width="0.8"/>
    <path d="M 10,20 Q 20,16 30,20 Q 40,24 50,20 Q 60,16 70,20" fill="none" stroke="#6AAE6A" stroke-width="0.8"/>
  </g>

