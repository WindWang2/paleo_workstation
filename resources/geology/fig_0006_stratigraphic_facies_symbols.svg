  <text x="30" y="825" class="desc">Coastal Facies</text>
  <text x="30" y="838" class="code">BH-O2-4C</text>
  <g transform="translate(250, 790)">
    <rect x="0" y="5" width="120" height="25" fill="#C8E6F0" stroke="#5AAAAA" stroke-width="1.5"/>
    <!-- wave pattern -->
