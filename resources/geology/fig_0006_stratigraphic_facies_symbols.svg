    <line x1="40" y1="10" x2="60" y2="30" stroke="#8A9AA0" stroke-width="1"/>
    <line x1="70" y1="10" x2="90" y2="30" stroke="#8A9AA0" stroke-width="1"/>
  </g>

  <!-- Alluvial fan -->
  <text x="30" y="1050" class="label">洪积相</text>
  <text x="30" y="1065" class="desc">Alluvial Fan Facies</text>
  <text x="30" y="1078" class="code">HJX-O1-3C</text>
  <g transform="translate(250, 1030)">
    <polygon points="60,5 120,30 0,30" fill="#E8DCC0" stroke="#B8A878" stroke-width="1.5"/>
  </g>

  <!-- Deposits boundary -->
  <text x="600" y="1050" class="label">沉积界线</text>
  <text x="600" y="1065" class="desc">Sedimentary Boundary</text>
  <text x="600" y="1078" class="code">CJJX-O5-2C</text>
  <g transform="translate(820, 1030)">
    <line x1="0" y1="15" x2="120" y2="15" stroke="#B8956A" stroke-width="1.5" stroke-dasharray="6,4"/>
  </g>

  <!-- ========== 侵入岩地质时代 Intrusive Rock Age ========== -->
