  <text x="30" y="898" class="code">CSH-O3-2C</text>
  <g transform="translate(250, 850)">
    <rect x="0" y="5" width="120" height="25" fill="#7EC8E3" stroke="#2A7A8A" stroke-width="1.5"/>
  </g>

  <!-- Deep marine -->
  <text x="600" y="870" class="label">深海相</text>
  <text x="600" y="885" class="desc">Deep Marine</text>
  <text x="600" y="898" class="code">SHX-O3-3C</text>
  <g transform="translate(820, 850)">
    <rect x="0" y="5" width="120" height="25" fill="#4AA8C8" stroke="#1A6A7A" stroke-width="1.5"/>
  </g>

