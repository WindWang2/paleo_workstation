  <text x="30" y="945" class="desc">Provenance Direction</text>
  <text x="30" y="958" class="code">WYFX-O4-1C</text>
  <g transform="translate(250, 910)">
    <line x1="0" y1="25" x2="100" y2="25" stroke="#D71414" stroke-width="2"/>
    <polygon points="95,18 105,25 95,32" fill="#D71414"/>
    <text x="60" y="50" text-anchor="middle" font-size="11" fill="#D71414">物源方向</text>
  </g>

  <!-- Alluvial -->
  <text x="600" y="930" class="label">残积相</text>
  <text x="600" y="945" class="desc">Residual Facies</text>
  <text x="600" y="958" class="code">CJX-O1-1C</text>
  <g transform="translate(820, 910)">
    <rect x="0" y="5" width="120" height="25" fill="#E8DCC0" stroke="#B8A878" stroke-width="1.5"/>
  </g>

  <!-- Aeolian -->
  <text x="30" y="990" class="label">沙漠相</text>
  <text x="30" y="1005" class="desc">Aeolian Facies</text>
  <text x="30" y="1018" class="code">SMX-O1-2C</text>
  <g transform="translate(250, 970)">
    <rect x="0" y="5" width="120" height="25" fill="#F5E6C8" stroke="#C8A868" stroke-width="1.5"/>
    <!-- dune pattern -->
    <path d="M 10,20 Q 30,5 50,20" fill="none" stroke="#C8A868" stroke-width="1.5"/>
    <path d="M 60,20 Q 80,5 100,20" fill="none" stroke="#C8A868" stroke-width="1.5"/>
  </g>

  <!-- Glacial -->
  <text x="600" y="990" class="label">冰川相</text>
  <text x="600" y="1005" class="desc">Glacial Facies</text>
  <text x="600" y="1018" class="code">BCX-O1-4C</text>
  <g transform="translate(820, 970)">
    <rect x="0" y="5" width="120" height="25" fill="#E8EEF0" stroke="#8A9AA0" stroke-width="1.5"/>
