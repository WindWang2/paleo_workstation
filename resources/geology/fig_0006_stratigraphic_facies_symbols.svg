  <g transform="translate(820, 670)">
    <polygon points="60,5 120,30 60,30" fill="#E8D5B0" stroke="#B8956A" stroke-width="1.5"/>
    <line x1="30" y1="30" x2="30" y2="10" stroke="#B8956A" stroke-width="1"/>
  </g>

