  <rect x="15" y="1118" width="1370" height="220" class="cell-border"/>

  <text x="30" y="1145" class="label">海西期</text>
  <text x="30" y="1160" class="desc">Hercynian</text>
  <text x="30" y="1173" class="code">QRYQ-N2-1C</text>
  <g transform="translate(250, 1125)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="30" y="25" text-anchor="middle" font-size="12" fill="#333">H</text>
  </g>

  <text x="600" y="1145" class="label">印支期</text>
  <text x="600" y="1160" class="desc">Indosinian</text>
  <text x="600" y="1173" class="code">ZAY-N2-2C</text>
  <g transform="translate(820, 1125)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="30" y="25" text-anchor="middle" font-size="12" fill="#333">Y</text>
  </g>

  <text x="30" y="1210" class="label">燕山期</text>
  <text x="30" y="1225" class="desc">Yanshanian</text>
  <text x="30" y="1238" class="code">HGY-N2-3C</text>
  <g transform="translate(250, 1190)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="30" y="25" text-anchor="middle" font-size="12" fill="#333">Y</text>
  </g>

  <text x="600" y="1210" class="label">花岗岩</text>
  <text x="600" y="1225" class="desc">Granite</text>
  <text x="600" y="1238" class="code">SCY-N2-4C</text>
  <g transform="translate(820, 1190)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="30" y="25" text-anchor="middle" font-size="10" fill="#333">γ</text>
  </g>

  <text x="30" y="1275" class="label">闪长岩</text>
  <text x="30" y="1290" class="desc">Diorite</text>
  <text x="30" y="1303" class="code">TMY-N2-5C</text>
  <g transform="translate(250, 1255)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="30" y="25" text-anchor="middle" font-size="10" fill="#333">δ</text>
  </g>

  <text x="600" y="1275" class="label">辉长岩</text>
  <text x="600" y="1290" class="desc">Gabbro</text>
  <text x="600" y="1303" class="code">CTMY-N2-6C</text>
  <g transform="translate(820, 1255)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="30" y="25" text-anchor="middle" font-size="10" fill="#333">ν</text>
  </g>

  <text x="30" y="1340" class="label">碱性岩</text>
  <text x="30" y="1355" class="desc">Alkaline Rock</text>
  <text x="30" y="1368" class="code">JXY-N2-7C</text>
  <g transform="translate(250, 1320)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="30" y="25" text-anchor="middle" font-size="10" fill="#333">λ</text>
  </g>

  <text x="600" y="1340" class="label">火山岩</text>
  <text x="600" y="1355" class="desc">Volcanic Rock</text>
  <text x="600" y="1368" class="code">HSY-N2-8C</text>
  <g transform="translate(820, 1320)">
    <circle cx="30" cy="20" r="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="30" y="25" text-anchor="middle" font-size="10" fill="#333">V</text>
  </g>

  <!-- Footer -->
  <text x="700" y="1475" text-anchor="middle" class="remark" fill="#888">
    注：地层单位用不同底色区分时代，沉积相用纹理和颜色区分沉积环境。
  </text>
</svg>
