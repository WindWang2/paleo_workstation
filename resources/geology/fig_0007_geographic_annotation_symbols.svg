  <!-- Background -->
  <rect width="1400" height="1400" fill="#fafafa"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title">地理与注记符号库</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">Geographic &amp; Annotation Symbol Library — Q/HS 1011—2016 附录 H, P</text>

  <!-- ========== 行政区划 Administrative Boundaries ========== -->
