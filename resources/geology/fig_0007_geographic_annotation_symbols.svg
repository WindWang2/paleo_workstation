    <circle cx="20" cy="15" r="3" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="50" cy="15" r="3" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="80" cy="15" r="3" fill="none" stroke="#000" stroke-width="1"/>
