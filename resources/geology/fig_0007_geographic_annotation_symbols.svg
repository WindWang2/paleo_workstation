    <rect x="5" y="11" width="8" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="20" y="11" width="8" height="8" fill="#000"/>
    <rect x="35" y="11" width="8" height="8" fill="none" stroke="#000" stroke-width="1"/>
