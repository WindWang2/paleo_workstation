<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200">
  <defs>
    <style>
      .title { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-family: SimSun, serif; font-size: 13px; fill: #666; }
      .category { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 15px; font-weight: bold; fill: #6b3f8a; }
      .label { font-family: SimSun, serif; font-size: 12px; fill: #1a1a1a; }
      .code { font-family: Arial, sans-serif; font-size: 10px; fill: #888; }
      .desc { font-family: SimSun, serif; font-size: 11px; fill: #444; }
      .remark { font-family: SimSun, serif; font-size: 10px; fill: #999; }
      .cell-border { fill: none; stroke: #ccc; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1200" fill="#fafafa"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title">褶皱构造符号库</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">Fold Structure Symbol Library — Q/HS 1011—2016 附录 I.3 (表 I.3)</text>

  <!-- ========== 褶皱类型 Fold Types ========== -->
  <text x="20" y="85" class="category">一、褶皱类型 (Fold Types)</text>
  <rect x="15" y="88" width="1370" height="500" class="cell-border"/>

  <!-- 背斜 Anticline -->
  <text x="30" y="115" class="label">背斜</text>
  <text x="30" y="130" class="desc">Anticline</text>
  <text x="30" y="143" class="code">ZZGZ-I3-1H/C</text>
  <g transform="translate(200, 95)">
    <path d="M 0,35 Q 40,5 80,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 80,35 Q 120,5 150,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <!-- axis line -->
    <line x1="80" y1="35" x2="80" y2="5" stroke="#000" stroke-width="1.5"/>
    <polygon points="75,8 80,3 85,8" fill="#000"/>
  </g>

  <!-- 向斜 Syncline -->
  <text x="400" y="115" class="label">向斜</text>
  <text x="400" y="130" class="desc">Syncline</text>
  <text x="400" y="143" class="code">ZZGZ-I3-2H/C</text>
  <g transform="translate(570, 95)">
    <path d="M 0,35 Q 40,65 80,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 80,35 Q 120,65 150,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <line x1="80" y1="35" x2="80" y2="65" stroke="#000" stroke-width="1.5"/>
  </g>

  <!-- 紧闭背斜 Tight anticline -->
  <text x="770" y="115" class="label">紧闭背斜</text>
  <text x="770" y="130" class="desc">Tight Anticline</text>
  <text x="770" y="143" class="code">ZZGZ-I3-3H/C</text>
  <g transform="translate(940, 95)">
    <path d="M 0,35 Q 20,8 40,35 Q 60,8 80,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 80,35 Q 100,8 120,35 Q 140,8 160,35" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 开阔背斜 Open anticline -->
  <text x="30" y="195" class="label">开阔背斜</text>
  <text x="30" y="210" class="desc">Open Anticline</text>
  <text x="30" y="223" class="code">ZZGZ-I3-4H/C</text>
  <g transform="translate(200, 175)">
    <path d="M 0,40 Q 60,10 120,40" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 倒转背斜 Overturned anticline -->
  <text x="400" y="195" class="label">倒转背斜</text>
  <text x="400" y="210" class="desc">Overturned Anticline</text>
  <text x="400" y="223" class="code">ZZGZ-I3-5H/C</text>
  <g transform="translate(570, 175)">
    <path d="M 0,40 Q 40,10 80,40" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 80,40 Q 120,70 160,40" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 平卧褶皱 Recumbent fold -->
  <text x="770" y="195" class="label">平卧褶皱</text>
  <text x="770" y="210" class="desc">Recumbent Fold</text>
  <text x="770" y="223" class="code">ZZGZ-I3-6H/C</text>
  <g transform="translate(940, 175)">
    <path d="M 0,30 L 160,30" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 0,35 Q 80,50 160,35" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 等斜褶皱 Isoclinal fold -->
  <text x="30" y="275" class="label">等斜褶皱</text>
  <text x="30" y="290" class="desc">Isoclinal Fold</text>
  <text x="30" y="303" class="code">ZZGZ-I3-7H/C</text>
  <g transform="translate(200, 255)">
    <path d="M 0,35 Q 40,65 80,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 80,35 Q 120,65 160,35" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 尖棱褶皱 Cuspate fold -->
  <text x="400" y="275" class="label">尖棱褶皱</text>
  <text x="400" y="290" class="desc">Cuspate / Chevron Fold</text>
  <text x="400" y="303" class="code">ZZGZ-I3-8H/C</text>
  <g transform="translate(570, 255)">
    <polyline points="0,35 40,5 80,35 120,5 160,35" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 箱状褶皱 Box fold -->
  <text x="770" y="275" class="label">箱状褶皱</text>
  <text x="770" y="290" class="desc">Box Fold</text>
  <text x="770" y="303" class="code">ZZGZ-I3-9H/C</text>
  <g transform="translate(940, 255)">
    <path d="M 0,40 L 40,10 L 120,10 L 160,40 L 120,70 L 40,70 Z" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 隔档式褶皱 Jug-handle fold -->
  <text x="30" y="355" class="label">隔档式褶皱</text>
  <text x="30" y="370" class="desc">Jug-Handle / Cheek Fold</text>
  <text x="30" y="383" class="code">ZZGZ-I3-10H/C</text>
  <g transform="translate(200, 335)">
    <path d="M 0,35 Q 30,5 60,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 80,35 L 80,5" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 100,35 Q 130,5 160,35" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 隔槽式褶皱 Trough fold -->
  <text x="400" y="355" class="label">隔槽式褶皱</text>
  <text x="400" y="370" class="desc">Trough Fold</text>
  <text x="400" y="383" class="code">ZZGZ-I3-11H/C</text>
  <g transform="translate(570, 335)">
    <path d="M 0,35 L 0,5 L 60,5" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 80,35 Q 110,65 140,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <path d="M 160,35 L 160,5" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 构造阶地 Structural terrace -->
  <text x="770" y="355" class="label">构造阶地</text>
  <text x="770" y="370" class="desc">Structural Terrace</text>
  <text x="770" y="383" class="code">ZZGZ-I3-12H/C</text>
  <g transform="translate(940, 335)">
    <polyline points="0,35 40,10 80,35 120,10 160,35" fill="none" stroke="#C87830" stroke-width="2"/>
    <line x1="0" y1="40" x2="160" y2="40" stroke="#000" stroke-width="1.5"/>
  </g>

  <!-- 穹隆构造 Dome -->
  <text x="30" y="435" class="label">穹隆构造</text>
  <text x="30" y="450" class="desc">Dome Structure</text>
  <text x="30" y="463" class="code">ZZGZ-I3-13H/C</text>
  <g transform="translate(200, 415)">
    <ellipse cx="60" cy="30" rx="50" ry="25" fill="none" stroke="#C87830" stroke-width="2"/>
    <ellipse cx="60" cy="30" rx="30" ry="15" fill="none" stroke="#C87830" stroke-width="1.5"/>
    <line x1="60" y1="5" x2="60" y2="55" stroke="#000" stroke-width="1.5"/>
  </g>

  <!-- 盆地构造 Basin -->
  <text x="400" y="435" class="label">盆地构造</text>
  <text x="400" y="450" class="desc">Basin Structure</text>
  <text x="400" y="463" class="code">ZZGZ-I3-14H/C</text>
  <g transform="translate(570, 415)">
    <ellipse cx="60" cy="30" rx="50" ry="25" fill="none" stroke="#C87830" stroke-width="2"/>
    <ellipse cx="60" cy="30" rx="30" ry="15" fill="none" stroke="#C87830" stroke-width="1.5"/>
  </g>

  <!-- 挠曲 Flexure -->
  <text x="770" y="435" class="label">挠曲</text>
  <text x="770" y="450" class="desc">Flexure</text>
  <text x="770" y="463" class="code">ZZGZ-I3-15H/C</text>
  <g transform="translate(940, 415)">
    <path d="M 0,40 Q 40,20 80,40 Q 120,60 160,40" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- 刺穿构造 Diapir -->
  <text x="30" y="515" class="label">刺穿构造</text>
  <text x="30" y="530" class="desc">Diapir / Piercing Structure</text>
  <text x="30" y="543" class="code">ZZGZ-I3-16H/C</text>
  <g transform="translate(200, 495)">
    <path d="M 0,40 Q 20,40 30,20 Q 40,0 60,0 Q 80,0 90,20 Q 100,40 120,40" fill="none" stroke="#C87830" stroke-width="2"/>
  </g>

  <!-- ========== 轴向与枢纽 Axial Plane & Hinge ========== -->
  <text x="20" y="590" class="category">二、轴向与枢纽 (Axial Plane &amp; Hinge)</text>
  <rect x="15" y="593" width="1370" height="200" class="cell-border"/>

  <text x="30" y="620" class="label">褶皱轴线</text>
  <text x="30" y="635" class="desc">Fold Axis</text>
  <text x="30" y="648" class="code">ZZGZ-I3-17H/C</text>
  <g transform="translate(250, 600)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#000" stroke-width="2"/>
    <polygon points="75,12 80,20 75,28" fill="#000"/>
  </g>

  <text x="600" y="620" class="label">枢纽线</text>
  <text x="600" y="635" class="desc">Hinge Line</text>
  <text x="600" y="648" class="code">ZZGZ-I3-18H/C</text>
  <g transform="translate(820, 600)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#000" stroke-width="1.5" stroke-dasharray="5,3"/>
  </g>

  <text x="30" y="690" class="label">倾伏端</text>
  <text x="30" y="705" class="desc">Plunging End</text>
  <text x="30" y="718" class="code">ZZGZ-I3-19H/C</text>
  <g transform="translate(250, 670)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#000" stroke-width="1.5"/>
    <polygon points="120,12 150,20 120,28" fill="#000"/>
  </g>

  <!-- ========== 地震反射特征 Seismic Reflection ========== -->
  <text x="20" y="815" class="category">三、地震反射特征 (Seismic Reflection Features)</text>
  <rect x="15" y="818" width="1370" height="200" class="cell-border"/>

  <text x="30" y="845" class="label">强反射</text>
  <text x="30" y="860" class="desc">Strong Reflection</text>
  <text x="30" y="873" class="code">ZZGZ-I3-20H/C</text>
  <g transform="translate(250, 825)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#000" stroke-width="3"/>
  </g>

  <text x="600" y="845" class="label">弱反射</text>
  <text x="600" y="860" class="desc">Weak Reflection</text>
  <text x="600" y="873" class="code">ZZGZ-I3-21H/C</text>
  <g transform="translate(820, 825)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <text x="30" y="915" class="label">杂乱反射</text>
  <text x="30" y="930" class="desc">Chaotic Reflection</text>
  <text x="30" y="943" class="code">ZZGZ-I3-22H/C</text>
  <g transform="translate(250, 900)">
    <path d="M 0,20 L 20,15 L 40,25 L 60,12 L 80,28 L 100,18 L 120,22 L 150,15" fill="none" stroke="#000" stroke-width="1.5"/>
  </g>

  <text x="600" y="915" class="label">空白反射</text>
  <text x="600" y="930" class="desc">Blank Reflection</text>
  <text x="600" y="943" class="code">ZZGZ-I3-23H/C</text>
  <g transform="translate(820, 900)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#CCC" stroke-width="1"/>
  </g>

  <!-- Footer -->
  <text x="700" y="1185" text-anchor="middle" class="remark" fill="#888">
    注：褶皱构造用线条表示岩层形态，轴部用粗线标注，枢纽用虚线表示。颜色 #C87830。
  </text>
</svg>
