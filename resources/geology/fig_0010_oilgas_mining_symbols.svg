<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  <defs>
    <style>
      .title { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-family: SimSun, serif; font-size: 13px; fill: #666; }
      .category { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 15px; font-weight: bold; fill: #2a8a4a; }
      .label { font-family: SimSun, serif; font-size: 12px; fill: #1a1a1a; }
      .code { font-family: Arial, sans-serif; font-size: 10px; fill: #888; }
      .desc { font-family: SimSun, serif; font-size: 11px; fill: #444; }
      .remark { font-family: SimSun, serif; font-size: 10px; fill: #999; }
      .cell-border { fill: none; stroke: #ccc; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1400" fill="#fafafa"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title">油气田分布、矿区与合作区块符号库</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">Oil-Gas Field Distribution, Mining &amp; Cooperation Block Symbol Library — Q/HS 1011—2016 附录 D.7-D.9, J</text>

  <!-- ========== 油气田分布 Oil-Gas Field Distribution ========== -->
  <text x="20" y="85" class="category">一、油气田分布 (Oil-Gas Field Distribution) — 附录 D.7, J.1</text>
  <rect x="15" y="88" width="1370" height="280" class="cell-border"/>

  <text x="30" y="115" class="label">油田</text>
  <text x="30" y="130" class="desc">Oil Field</text>
  <text x="30" y="143" class="code">YTCL-J1-1H/C</text>
  <text x="350" y="130" class="remark">绿色圆点 #00AA00</text>
  <g transform="translate(250, 100)">
    <circle cx="30" cy="25" r="22" fill="#00AA00" stroke="#000" stroke-width="1.5"/>
    <text x="30" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">油</text>
  </g>

  <text x="600" y="115" class="label">气田</text>
  <text x="600" y="130" class="desc">Gas Field</text>
  <text x="600" y="143" class="code">QTCL-J1-2H/C</text>
  <text x="920" y="130" class="remark">橙红色圆点 #FF3300</text>
  <g transform="translate(820, 100)">
    <circle cx="30" cy="25" r="22" fill="#FF3300" stroke="#000" stroke-width="1.5"/>
    <text x="30" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">气</text>
  </g>

  <text x="30" y="195" class="label">油气田（联合）</text>
  <text x="30" y="210" class="desc">Oil-Gas Field (Combined)</text>
  <text x="30" y="223" class="code">YTCL-J1-3H/C</text>
  <g transform="translate(250, 180)">
    <circle cx="30" cy="25" r="22" fill="#00AA00" stroke="#000" stroke-width="1.5"/>
    <text x="30" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">油</text>
  </g>
  <g transform="translate(310, 180)">
    <circle cx="30" cy="25" r="22" fill="#FF3300" stroke="#000" stroke-width="1.5"/>
    <text x="30" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">气</text>
  </g>
  <text x="400" y="210" class="remark">相邻放置</text>

  <text x="600" y="195" class="label">油气水边界线</text>
  <text x="600" y="210" class="desc">Oil-Gas-Water Boundary</text>
  <text x="600" y="223" class="code">YQSX-J2-1H/C</text>
  <text x="920" y="210" class="remark">粗实线</text>
  <g transform="translate(820, 190)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#000" stroke-width="3"/>
  </g>

  <!-- Field name labels -->
  <text x="30" y="265" class="label">油气田名称标注</text>
  <text x="30" y="280" class="desc">Oil-Gas Field Name Label</text>
  <text x="30" y="293" class="code">YQBZ-P3-4H/C</text>
  <g transform="translate(250, 255)">
    <text x="0" y="22" font-size="13" font-weight="bold" fill="#000">QHD32-6</text>
    <circle cx="95" cy="18" r="9" fill="#00AA00"/>
  </g>

  <!-- ========== 矿区 Mining Areas ========== -->
  <text x="20" y="365" class="category">二、矿区 (Mining Areas) — 附录 D.8</text>
  <rect x="15" y="368" width="1370" height="240" class="cell-border"/>

  <text x="30" y="395" class="label">自营勘查矿区</text>
  <text x="30" y="410" class="desc">Self-Operated Exploration Block</text>
  <text x="30" y="423" class="code">MIN-D8-1H/C</text>
  <text x="350" y="410" class="remark">粉红/红色填充</text>
  <g transform="translate(250, 380)">
    <rect x="0" y="5" width="120" height="35" fill="#FFCCCC" stroke="#D71414" stroke-width="1.5"/>
  </g>

  <text x="600" y="395" class="label">联合勘查矿区</text>
  <text x="600" y="410" class="desc">Joint Exploration Block</text>
  <text x="600" y="423" class="code">MIN-D8-2H/C</text>
  <text x="920" y="410" class="remark">绿色填充</text>
  <g transform="translate(820, 380)">
    <rect x="0" y="5" width="120" height="35" fill="#CCFFCC" stroke="#00AA00" stroke-width="1.5"/>
  </g>

  <text x="30" y="475" class="label">合作矿区</text>
  <text x="30" y="490" class="desc">Cooperation Block</text>
  <text x="30" y="503" class="code">MIN-D8-3H/C</text>
  <text x="350" y="490" class="remark">蓝色填充</text>
  <g transform="translate(250, 460)">
    <rect x="0" y="5" width="120" height="35" fill="#CCE5FF" stroke="#0071FF" stroke-width="1.5"/>
  </g>

  <text x="600" y="475" class="label">开采矿区</text>
  <text x="600" y="490" class="desc">Production Block</text>
  <text x="600" y="503" class="code">MIN-D8-4H/C</text>
  <text x="920" y="490" class="remark">紫色填充</text>
  <g transform="translate(820, 460)">
    <rect x="0" y="5" width="120" height="35" fill="#E0CCFF" stroke="#9B59B6" stroke-width="1.5"/>
  </g>

  <!-- ========== 合作区块 Cooperation Blocks ========== -->
  <text x="20" y="555" class="category">三、合作区块 (Cooperation Blocks) — 附录 D.9</text>
  <rect x="15" y="558" width="1370" height="260" class="cell-border"/>

  <text x="30" y="585" class="label">自营合同区</text>
  <text x="30" y="600" class="desc">Self-Operated Contract Area</text>
  <text x="30" y="613" class="code">COOP-D9-1H/C</text>
  <g transform="translate(250, 565)">
    <rect x="0" y="5" width="120" height="35" fill="#FFE4E1" stroke="#D71414" stroke-width="1.5"/>
  </g>

  <text x="600" y="585" class="label">合作合同区</text>
  <text x="600" y="600" class="desc">Joint Contract Area</text>
  <text x="600" y="613" class="code">COOP-D9-2H/C</text>
  <g transform="translate(820, 565)">
    <rect x="0" y="5" width="120" height="35" fill="#E0F0FF" stroke="#0071FF" stroke-width="1.5"/>
  </g>

  <text x="30" y="655" class="label">合同区块边界</text>
  <text x="30" y="670" class="desc">Contract Block Boundary</text>
  <text x="30" y="683" class="code">COOP-D9-3H/C</text>
  <g transform="translate(250, 645)">
    <rect x="0" y="5" width="120" height="30" fill="none" stroke="#0071FF" stroke-width="2"/>
  </g>

  <text x="600" y="655" class="label">合同区块编号</text>
  <text x="600" y="670" class="desc">Contract Block Number</text>
  <text x="600" y="683" class="code">COOP-D9-4H/C</text>
  <g transform="translate(820, 645)">
    <rect x="0" y="5" width="120" height="30" fill="#E8F4FF" stroke="#0071FF" stroke-width="1.5"/>
    <text x="60" y="27" text-anchor="middle" font-size="12" fill="#0071FF">15/06</text>
  </g>

  <!-- Block label example -->
  <text x="30" y="735" class="label">合作区块标注格式</text>
  <text x="30" y="750" class="desc">Cooperation Block Label Format</text>
  <text x="30" y="763" class="code">COOP-D9-5H/C</text>
  <g transform="translate(250, 720)">
    <rect x="0" y="0" width="130" height="50" rx="3" fill="#E8F4FF" stroke="#0071FF" stroke-width="1.5"/>
    <text x="65" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">09/06 合同区</text>
    <text x="65" y="36" text-anchor="middle" font-size="10" fill="#666">地震采集: 2D 0~1200km</text>
  </g>

  <!-- ========== 矿区边界 Mining Boundary ========== -->
  <text x="20" y="835" class="category">四、矿区边界与其他 (Mining Boundaries &amp; Others)</text>
  <rect x="15" y="838" width="1370" height="200" class="cell-border"/>

  <text x="30" y="865" class="label">矿区边界线</text>
  <text x="30" y="880" class="desc">Mining Block Boundary</text>
  <text x="30" y="893" class="code">MIN-D8-5H/C</text>
  <g transform="translate(250, 855)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#0071FF" stroke-width="2"/>
  </g>

  <text x="600" y="865" class="label">预测矿区边界</text>
  <text x="600" y="880" class="desc">Predicted Mining Boundary</text>
  <text x="600" y="893" class="code">MIN-D8-6H/C</text>
  <g transform="translate(820, 855)">
    <line x1="0" y1="20" x2="150" y2="20" stroke="#0071FF" stroke-width="1.5" stroke-dasharray="8,4"/>
  </g>

  <text x="30" y="935" class="label">圈闭（一类）</text>
  <text x="30" y="950" class="desc">1st Class Trap</text>
  <text x="30" y="963" class="code">QUANB-B2-36C</text>
  <g transform="translate(250, 915)">
    <polygon points="60,0 120,40 60,80 0,40" fill="#FE9999" stroke="#E87070" stroke-width="1.5"/>
  </g>

  <text x="600" y="935" class="label">圈闭（二类）</text>
  <text x="600" y="950" class="desc">2nd Class Trap</text>
  <text x="600" y="963" class="code">QUANB-B2-37C</text>
  <g transform="translate(820, 915)">
    <polygon points="60,0 120,40 60,80 0,40" fill="#FECC" stroke="#E0B000" stroke-width="1.5"/>
  </g>

  <!-- ========== 储量级别 Reserve Categories ========== -->
  <text x="20" y="1045" class="category">五、储量级别 (Reserve Categories)</text>
  <rect x="15" y="1048" width="1370" height="220" class="cell-border"/>

  <text x="30" y="1075" class="label">探明储量</text>
  <text x="30" y="1090" class="desc">Proved Reserve</text>
  <text x="30" y="1103" class="code">RES-J3-1H/C</text>
  <g transform="translate(250, 1060)">
    <circle cx="30" cy="25" r="20" fill="#00AA00" stroke="#000" stroke-width="1.5"/>
    <text x="30" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">探明</text>
  </g>

  <text x="600" y="1075" class="label">控制储量</text>
  <text x="600" y="1090" class="desc">Controlled Reserve</text>
  <text x="600" y="1103" class="code">RES-J3-2H/C</text>
  <g transform="translate(820, 1060)">
    <circle cx="30" cy="25" r="20" fill="#66BB6A" stroke="#000" stroke-width="1.5"/>
    <text x="30" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">控制</text>
  </g>

  <text x="30" y="1145" class="label">预测储量</text>
  <text x="30" y="1160" class="desc">Forecast / Inferred Reserve</text>
  <text x="30" y="1173" class="code">RES-J3-3H/C</text>
  <g transform="translate(250, 1135)">
    <circle cx="30" cy="25" r="20" fill="#FFEB3B" stroke="#000" stroke-width="1.5"/>
    <text x="30" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">预测</text>
  </g>

  <text x="600" y="1145" class="label">远景资源量</text>
  <text x="600" y="1160" class="desc">Prospective Resource</text>
  <text x="600" y="1173" class="code">RES-J3-4H/C</text>
  <g transform="translate(820, 1135)">
    <circle cx="30" cy="25" r="20" fill="#FFF" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="30" y="30" text-anchor="middle" font-size="10" fill="#666">远景</text>
  </g>

  <!-- Footer -->
  <text x="700" y="1395" text-anchor="middle" class="remark" fill="#888">
    注：矿区/合作区块用不同底色区分类型，储量级别用不同颜色和填充表示。粉色=自营，蓝色=合作/联合，绿色=油田，橙色=气田。
  </text>
</svg>
