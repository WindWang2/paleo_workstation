<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1600" width="1400" height="1600">
  <defs>
    <style>
      .title { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-family: SimSun, serif; font-size: 13px; fill: #666; }
      .category { font-family: SimHei, Microsoft YaHei, sans-serif; font-size: 15px; font-weight: bold; fill: #8a5a2a; }
      .label { font-family: SimSun, serif; font-size: 12px; fill: #1a1a1a; }
      .code { font-family: Arial, sans-serif; font-size: 10px; fill: #888; }
      .desc { font-family: SimSun, serif; font-size: 11px; fill: #444; }
      .remark { font-family: SimSun, serif; font-size: 10px; fill: #999; }
      .cell-border { fill: none; stroke: #ccc; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1600" fill="#fafafa"/>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title">岩石基本符号与层理构造符号库</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">Rock Basic Symbols &amp; Stratification Symbol Library — Q/HS 1011—2016 附录 M.1, M.2.9</text>

  <!-- ========== 基本岩类 Basic Rock Types ========== -->
  <text x="20" y="85" class="category">一、基本岩类符号 (Basic Rock Type Symbols) — 附录 M.1.1</text>
  <rect x="15" y="88" width="1370" height="520" class="cell-border"/>

  <text x="30" y="115" class="label">沉积岩</text>
  <text x="30" y="130" class="desc">Sedimentary Rock</text>
  <text x="30" y="143" class="code">ROCK-M1-1H/C</text>
  <text x="350" y="130" class="remark">点状填充</text>
  <g transform="translate(250, 100)">
    <rect x="0" y="5" width="120" height="30" fill="url(#sandstone_medium)" stroke="#999" stroke-width="1"/>
  </g>

  <text x="600" y="115" class="label">岩浆岩</text>
  <text x="600" y="130" class="desc">Magmatic Rock</text>
  <text x="600" y="143" class="code">ROCK-M1-2H/C</text>
  <text x="920" y="130" class="remark">晶质填充</text>
  <g transform="translate(820, 100)">
    <rect x="0" y="5" width="120" height="30" fill="url(#granite)" stroke="#999" stroke-width="1"/>
  </g>

  <text x="30" y="185" class="label">变质岩</text>
  <text x="30" y="200" class="desc">Metamorphic Rock</text>
  <text x="30" y="213" class="code">ROCK-M1-3H/C</text>
  <text x="350" y="200" class="remark">片状填充</text>
  <g transform="translate(250, 170)">
    <rect x="0" y="5" width="120" height="30" fill="url(#gneiss)" stroke="#999" stroke-width="1"/>
  </g>

