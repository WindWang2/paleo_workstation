  <text x="30" y="440" class="desc">Mudstone</text>
  <text x="30" y="453" class="code">ROCK-M1-10H/C</text>
  <g transform="translate(250, 410)">
    <rect x="0" y="5" width="120" height="30" fill="url(#mudstone)" stroke="#999" stroke-width="1"/>
  </g>

  <text x="600" y="425" class="label">煤</text>
  <text x="600" y="440" class="desc">Coal</text>
  <text x="600" y="453" class="code">ROCK-M1-11H/C</text>
