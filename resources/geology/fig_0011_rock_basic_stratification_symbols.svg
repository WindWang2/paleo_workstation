  <!-- Footer -->
  <text x="700" y="1595" text-anchor="middle" class="remark" fill="#888">
    注：基本岩类符号为地质图件中最常用的填充纹理。化石符号用于地层对比和年代鉴定。层理构造反映沉积环境。
  </text>
