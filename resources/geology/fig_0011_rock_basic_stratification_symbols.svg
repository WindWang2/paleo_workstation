  <text x="30" y="500" class="desc">Volcanic Rock</text>
  <text x="30" y="513" class="code">ROCK-M1-12H/C</text>
  <g transform="translate(250, 470)">
    <rect x="0" y="5" width="120" height="30" fill="url(#basalt)" stroke="#999" stroke-width="1"/>
