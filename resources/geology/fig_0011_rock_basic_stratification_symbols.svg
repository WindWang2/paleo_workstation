  <!-- ========== 主碎屑物 Main Clastic Components ========== -->
  <text x="20" y="575" class="category">二、主碎屑物符号 (Main Clastic Components) — 附录 M.1.2</text>
  <rect x="15" y="578" width="1370" height="260" class="cell-border"/>

  <text x="30" y="605" class="label">石英</text>
  <text x="30" y="620" class="desc">Quartz</text>
  <text x="30" y="633" class="code">CLST-M1-1H/C</text>
  <g transform="translate(250, 585)">
    <polygon points="30,5 38,20 30,35 22,20" fill="none" stroke="#666" stroke-width="1.5"/>
